<!DOCTYPE html>
<html lang="es">
<head>

<title>NeuroComunica</title>

<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{--bg:#0a0a0b;--bg2:#101013;--panel:#141418;--panel2:#1b1b21;--line:#26262d;--tx:#e8e8ec;--mu:#9a9aa5;--am:#f59e0b;--amd:#b45309;--cy:#06b6d4;--cyd:#0e7490;--ok:#22c55e;--bad:#ef4444;--r:14px;
--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}html.big{font-size:18.5px}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cy)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) calc(14px + var(--sar)) 10px calc(14px + var(--sal));background:rgba(10,10,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--am),var(--cy));display:grid;place-items:center;font-size:17px}
header.top h1{font-size:1.02rem;margin:0;flex:1;letter-spacing:.3px}
header.top h1 b{color:var(--am)}
.ib{background:var(--panel2);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:17px}
main{padding:16px calc(14px + var(--sar)) calc(96px + var(--sab)) calc(14px + var(--sal));max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:rgba(16,16,19,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px calc(4px + var(--sar)) calc(6px + var(--sab)) calc(4px + var(--sal))}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mu);border-radius:10px}
nav.tabs button span{font-size:1.3rem;line-height:1}
nav.tabs button.on{color:var(--am);background:rgba(245,158,11,.08)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 8px}
h2{font-size:1.3rem}h3{font-size:1.08rem}
.muted{color:var(--mu)}.small{font-size:.86rem}.mono{font-family:var(--mono)}
.am{color:var(--am)}.cy{color:var(--cy)}.okc{color:var(--ok)}.badc{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 16px;font-weight:600;min-height:46px}
.btn.pri{background:var(--am);color:#111;border-color:var(--am)}
.btn.sec{background:transparent;border-color:var(--cy);color:var(--cy)}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--mono);font-size:1.45rem;color:var(--am)}
.stat span{font-size:.8rem;color:var(--mu)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--am),var(--cy));border-radius:99px;transition:width .5s}
.mod{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left}
.mod .ic{font-size:1.8rem;width:50px;height:50px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;flex:none}
.mod .t{font-weight:700}.mod .s{font-size:.84rem;color:var(--mu)}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mu);font-family:var(--mono)}
.tag.ok{border-color:var(--ok);color:var(--ok)}.tag.am{border-color:var(--am);color:var(--am)}
/* lección */
.lesson-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 14px}
.dots i{width:22px;height:5px;border-radius:9px;background:var(--line)}
.dots i.r{background:var(--cyd)}.dots i.c{background:var(--am)}
.lesson h2{font-size:1.4rem;line-height:1.25;margin:4px 0 12px}
.lesson p,.lesson li{font-size:1.02rem}
.lesson ul,.lesson ol{padding-left:22px}
.lesson li{margin-bottom:6px}
.relato{font-family:var(--serif);font-size:1.12rem;line-height:1.75}
.relato p{margin:0 0 14px}
.relato .dlg{font-style:italic;color:#f3e2c0;padding-left:14px;border-left:2px solid var(--amd)}
.drop::first-letter{float:left;font-size:3.6em;line-height:.85;padding:6px 8px 0 0;color:var(--am);font-weight:700}
.chap{font-family:var(--mono);font-size:.78rem;letter-spacing:2px;color:var(--cy);text-transform:uppercase}
.callout{border-radius:12px;padding:12px 14px;margin:14px 0;border:1px solid}
.callout.amber{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.35)}
.callout.cyan{background:rgba(6,182,212,.07);border-color:rgba(6,182,212,.35)}
.callout ul{margin:6px 0 0}
.dato{background:linear-gradient(135deg,rgba(168,85,247,.1),rgba(6,182,212,.06));border:1px dashed rgba(168,85,247,.5);border-radius:12px;padding:12px 14px;margin:16px 0}
.dato h5,.tip h5{margin:0 0 4px;font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase}
.dato h5{color:#c084fc}.tip h5{color:var(--ok)}
.tip{background:rgba(34,197,94,.07);border-left:3px solid var(--ok);border-radius:0 12px 12px 0;padding:10px 14px;margin:16px 0}
.gancho{font-family:var(--serif);font-style:italic;color:var(--am);font-size:1.05rem;margin:18px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.gancho::before{content:"➜ ";font-style:normal}
.myth{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);border-radius:10px;padding:10px 12px;font-style:italic}
.bigq{font-family:var(--serif);font-size:1.35rem;text-align:center;padding:16px;border:1px solid var(--am);border-radius:12px;margin:12px 0;color:var(--am)}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pillars div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.pillars b{color:var(--am);display:block}.pillars span{font-size:.88rem;color:var(--mu)}
ol.steps li::marker{color:var(--am);font-weight:700}
.tech{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.tech h4{margin:0 0 6px;color:var(--cy)}
.tech .ej{font-family:var(--serif);font-style:italic;color:#f3e2c0;margin:6px 0 0}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px;text-align:left;vertical-align:top}
.tbl th{background:var(--panel2);color:var(--am)}
.checklist h4{color:var(--cy);margin:12px 0 6px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.checklist input{width:20px;height:20px;accent-color:var(--am);flex:none;margin-top:3px}
.check{background:var(--bg2);border:1px solid var(--cyd);border-radius:12px;padding:12px 14px;margin-top:18px}
.check .q{font-weight:600}.check .ans{margin-top:8px;color:var(--cy);display:none}.check.open .ans{display:block}
.navrow{display:flex;gap:10px;margin-top:18px}.navrow .btn{flex:1}
.speak{font-size:.85rem;padding:6px 10px;min-height:34px}
/* widgets */
.w{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:12px 0}
.w svg{width:100%;height:auto;display:block}
.zone{cursor:pointer;transition:opacity .2s;opacity:.55}.zone:hover,.zone.on{opacity:.95}
.winfo{min-height:72px;padding:10px;border-radius:10px;background:var(--panel2);margin-top:8px;font-size:.93rem}
.winfo b{display:block;margin-bottom:2px}
.flow{display:flex;flex-direction:column;gap:6px}
.flow button{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left}
.flow button.on{border-color:var(--am);background:rgba(245,158,11,.08)}
.flow .ar{text-align:center;color:var(--mu);line-height:1;font-size:.8rem}
.flow .fi{font-size:1.4rem}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:.85rem}
.seg button.on{border-color:var(--cy);color:var(--cy)}
.tl{display:flex;flex-direction:column;gap:6px}
.tl .m{display:grid;grid-template-columns:62px 1fr;gap:10px;background:var(--panel2);border-radius:10px;padding:10px;border-left:4px solid var(--am)}
.tl .m:nth-child(even){border-left-color:var(--cy)}
.tl .m b{font-family:var(--mono);color:var(--am)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.qp{font-size:1.12rem;font-weight:600;margin:8px 0 14px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:9px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:1rem}
.opt.ok{border-color:var(--ok);background:rgba(34,197,94,.12)}
.opt.bad{border-color:var(--bad);background:rgba(239,68,68,.12)}
.opt.sel{border-color:var(--cy)}
.opt:disabled{opacity:1}
.ordlist .opt{display:flex;gap:10px;align-items:center}
.ordlist .n{font-family:var(--mono);color:var(--am);min-width:22px}
.fb{border-radius:12px;padding:12px;margin:10px 0;font-size:.95rem}
.fb.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4)}
.fb.bad{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4)}
.big-score{font-family:var(--mono);font-size:3rem;font-weight:800;text-align:center;color:var(--am);line-height:1.1}
/* flashcards */
.flash{perspective:1000px;height:260px;margin:12px 0}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .in{transform:rotateY(180deg)}
.flash .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line)}
.flash .front{background:linear-gradient(160deg,var(--panel2),var(--panel));font-size:1.2rem;font-weight:700}
.flash .back{background:linear-gradient(160deg,#0b2a30,var(--panel));transform:rotateY(180deg);font-size:1.02rem}
.flash small{position:absolute;top:10px;left:14px;font-size:.72rem;color:var(--mu);font-family:var(--mono)}
.boxes{display:flex;gap:6px}.boxes div{flex:1;text-align:center;background:var(--panel2);border-radius:10px;padding:8px 2px;border:1px solid var(--line)}
.boxes b{display:block;font-family:var(--mono);color:var(--cy);font-size:1.1rem}.boxes span{font-size:.7rem;color:var(--mu)}
/* forms */
label.f{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input.t,textarea.t,select.t{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--tx);font:inherit}
textarea.t{min-height:70px;resize:vertical}
.rub{border-bottom:1px solid var(--line);padding:10px 0}
.rub .lv{display:flex;gap:6px;margin-top:6px}
.rub .lv button{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono)}
.rub .lv button.on{background:var(--am);color:#111;border-color:var(--am)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tg{width:50px;height:28px;border-radius:99px;background:var(--line);position:relative;border:0;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--am)}.tg.on::after{left:25px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--am);padding:10px 16px;border-radius:12px;z-index:50;font-size:.92rem;max-width:90vw;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.ring{width:110px;height:110px;flex:none}
.hero{display:flex;gap:16px;align-items:center}
.chart{width:100%;height:auto}
.fade{animation:fd .3s}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:grid;place-items:center;padding:calc(20px + var(--sat)) 16px calc(20px + var(--sab))}
.modal .card{max-width:520px;width:100%;max-height:85vh;overflow:auto}
pre.guion{white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:.85rem}
</style>
</head>
<body>
<header class="top"><div class="logo">🧠</div><h1>Neuro<b>Comunica</b></h1><button class="ib" onclick="go('ajustes')" aria-label="Ajustes">⚙️</button></header>
<main id="view"></main>
<nav class="tabs">
<button data-go="inicio"><span>🏠</span>Inicio</button>
<button data-go="aprender"><span>📖</span>Aprender</button>
<button data-go="evaluar"><span>📊</span>Evaluar</button>
<button data-go="repasar"><span>🗂️</span>Repasar</button>
<button data-go="charla"><span>🎤</span>Charla</button>
</nav>
<script>/* NeuroComunica: contenido educativo narrativo
   Estructura por módulo: relato (capítulo de la novela), secciones [{t,h,dato,tip,gancho,check}], claves, quiz, cartas
   Tipos de pregunta: mc (c = índice correcto), vf (c = true/false), orden (items en orden correcto)
   d:true marca las preguntas del diagnóstico (se repiten en el examen final para medir ganancia)
   Personajes y hechos de los relatos: ficticios. Datos insólitos: estudios reales citados por autor y año. */

const MODULOS = [
/* ================= MÓDULO 1 ================= */
{
id:'m1', icono:'🧠', titulo:'El cerebro que aprende', sub:'Las piezas clave y qué hace cada una', min:12,
relato:{t:'Capítulo 1 · La charla que nadie recordó', h:`
<p class="drop">Tres días después de su primera charla de seguridad, Rosa Pinedo descubrió que nadie recordaba una sola palabra. Lo supo a las seis y cuarenta de la mañana, con el café todavía quemándole la lengua, cuando le preguntó a Teodoro Huaymacari de qué había tratado.</p>
<p>Teodoro llevaba veintidós años operando la grúa del muelle. Se rascó la nuca debajo del casco, miró el río como si la respuesta flotara en el agua marrón, y dijo:</p>
<p class="dlg">«Algo de los cascos, ¿no, inge?»</p>
<p>La charla había sido sobre línea de fuego. Catorce minutos. Once normas. Diecinueve láminas que Rosa leyó una por una, con la voz firme que había ensayado frente al espejo del contenedor. Veintiocho firmas en la lista. Cero recuerdos.</p>
<p>Esa noche no durmió. Daba vueltas en el catre con una pregunta que le pareció una ofensa personal: ¿por qué Teodoro recordaba con lujo de detalles el día de 2009 en que un grillete reventó y pasó silbando a un metro de su cabeza, y no recordaba nada de lo que ella había dicho tres días antes?</p>
<p>La respuesta, aunque Rosa todavía no lo sabía, estaba escondida a tres centímetros detrás de los ojos de Teodoro. Y empezaba con una trocha.</p>
<p class="muted small">Rosa, Teodoro y los demás personajes son ficticios. Los datos científicos de cada sección son reales.</p>`},
secciones:[
{t:'Una red que se reconstruye', h:`
<p>Dentro de tu cabeza viven unos <b>86 mil millones de neuronas</b>. Cada una se conecta con miles de otras a través de puntos de contacto llamados <b>sinapsis</b>. En total, unos 100 billones de conexiones. Más que estrellas en la Vía Láctea.</p>
<p>Aprender consiste en <b>cambiar esas conexiones</b>: algunas se fortalecen, otras nacen, otras se debilitan hasta desaparecer. A esa capacidad de cambio la llamamos <b>plasticidad</b>.</p>
<div class="callout amber"><b>Regla de Hebb:</b> las neuronas que se activan juntas se conectan entre sí. Cada vez que repites algo prestando atención, ese circuito se vuelve más fuerte y más rápido.</div>
<div class="callout cyan"><b>🌿 Piénsalo como una trocha en la selva.</b> La primera vez abres camino a machete y sudas. Si pasas todos los días, se vuelve sendero. Si dejas de pasar, el monte lo cubre en semanas. Teodoro había recorrido la trocha del grillete mil veces, contándola en cada reunión. La charla de Rosa fue un machetazo solitario.</div>`,
dato:'Santiago Ramón y Cajal, el español que ganó el Nobel de Medicina en 1906, fue el primero en demostrar que el cerebro está hecho de neuronas separadas. Pasaba noches dibujándolas a mano en su microscopio y las llamaba «las mariposas del alma». Sus dibujos todavía se usan en las clases de neurociencia.',
tip:'Cuando quieras que algo se quede, haz que tu público lo use al menos tres veces en la misma charla: lo escucha, lo dice y lo muestra.',
gancho:'Pero ¿dónde exactamente se guardó el grillete de Teodoro? Hay un mapa.',
check:{p:'¿Qué cambia físicamente en tu cerebro cuando aprendes algo?', r:'Cambian las conexiones entre neuronas (sinapsis): se fortalecen, se crean nuevas o se debilitan las que no usas.'}},
{t:'El mapa: quién hace qué', h:`
<p>Toca cada zona del dibujo para ver su función en el aprendizaje.</p>
<div data-widget="cerebro"></div>
<p>Si pudieras abrir la cabeza de Teodoro en el momento del grillete, verías a la <b>amígdala</b> disparar la alarma, al <b>hipocampo</b> grabando todo con prioridad máxima y a la <b>corteza prefrontal</b> apagándose un instante mientras el cuerpo se agachaba solo.</p>
<p class="muted small">Ojo: ninguna zona trabaja sola. Funcionan como equipos conectados (redes). El mapa simplifica para que lo recuerdes.</p>`,
dato:'En 1848, en Vermont, una barra de hierro de un metro atravesó la cabeza del capataz ferroviario Phineas Gage y le destruyó parte de la corteza prefrontal. Sobrevivió, conversaba y caminaba. Pero los registros de la época dicen que el hombre responsable y ordenado se volvió impulsivo e incapaz de planificar. Fue una de las primeras pistas de que la prefrontal es el "jefe de turno" del cerebro. Los historiadores creen que su caso se exageró con los años, pero el cambio inicial está documentado.',
tip:'Si tu público acaba de vivir un susto (un casi accidente esa mañana), espera unos minutos antes de explicar algo complejo: la amígdala todavía tiene el control.',
gancho:'El mapa explica dónde. Falta el combustible: cuatro sustancias deciden qué se graba y qué se borra.',
check:{p:'¿Qué estructura actúa como "archivador" que convierte la experiencia en recuerdo duradero?', r:'El hipocampo. Registra lo nuevo y, sobre todo durante el sueño, ayuda a transferirlo a la corteza.'}},
{t:'La química del aprendizaje', h:`
<p>Cuatro mensajeros químicos deciden en gran parte qué se graba:</p>
<ul>
<li><b>Dopamina:</b> se libera cuando algo resulta mejor o distinto de lo esperado, o cuando anticipas una recompensa. Te empuja a buscar. La curiosidad la enciende.</li>
<li><b>Noradrenalina:</b> el estado de alerta. Un poco te despierta; demasiado te pone tenso.</li>
<li><b>Acetilcolina:</b> afina la atención y abre la puerta a la plasticidad.</li>
<li><b>Cortisol:</b> la hormona del estrés. Breve y moderado ayuda a fijar lo importante. Alto y sostenido apaga la corteza prefrontal y daña el hipocampo.</li>
</ul>
<p>El grillete de Teodoro le dio una dosis perfecta: un segundo de terror, ningún daño, y veintidós años de historia para contar. La charla de Rosa le dio cero sorpresa, cero curiosidad y catorce minutos de voz pareja. Química plana.</p>
<div class="callout amber"><b>Conclusión práctica:</b> curiosidad y algo de reto ayudan. Amenaza, gritos y humillación bloquean.</div>`,
dato:'En los años 90, Wolfram Schultz midió neuronas de dopamina en monos que recibían jugo después de una luz. Al principio, la dopamina se disparaba con el jugo. Cuando el mono aprendió la secuencia, se disparaba con la luz, antes del premio. Y si el jugo no llegaba, la actividad caía por debajo de lo normal. La dopamina responde a la anticipación y a la sorpresa más que al premio mismo.',
tip:'Anuncia al inicio que al final habrá algo ("al final les muestro el grillete que reventó"). La anticipación mantiene la atención durante toda la charla.',
gancho:'Y hay un detalle que explica por qué la gente "firma y se va": tu cerebro es un tacaño profesional.',
check:{p:'¿Qué pasa con el aprendizaje cuando una persona está bajo estrés intenso y prolongado?', r:'El cortisol alto bloquea la corteza prefrontal (atención y razonamiento) y perjudica al hipocampo, así que aprende y recuerda peor.'}},
{t:'Un cerebro que ahorra energía', h:`
<p>Tu cerebro pesa alrededor del <b>2% de tu cuerpo</b> y consume cerca del <b>20% de tu energía</b>. Por eso busca ahorrar siempre que puede:</p>
<ul>
<li><b>Filtra:</b> descarta casi todo lo que llega a tus sentidos.</li>
<li><b>Automatiza:</b> lo que repites muchas veces pasa a los ganglios basales y al cerebelo, y se vuelve hábito. Ya no necesita pensarse.</li>
</ul>
<p>A las seis y media de la mañana, con el motor de la chata rugiendo, el cerebro de cada trabajador hizo una cuenta rápida durante la charla de Rosa: «esto se parece a las otras cien charlas». Y activó el piloto automático.</p>
<div class="callout cyan"><b>⛑️ En campo:</b> escuchar una norma no la vuelve hábito. La conducta segura se automatiza con práctica repetida y retroalimentación, igual que aprendiste a manejar. Una charla abre el camino; la práctica lo pavimenta.</div>`,
dato:'Tu cerebro funciona con unos 20 vatios, menos que un foco ahorrador. Con esa energía coordina 86 mil millones de neuronas. Una supercomputadora que intenta simular una fracción de esa actividad consume millones de vatios.',
tip:'Rompe el patrón de "otra charla más" cambiando algo visible: el lugar, la hora, quién habla primero o un objeto en tus manos. El cerebro desactiva el piloto automático cuando detecta algo distinto.',
gancho:'Quedaba una duda que Rosa no se atrevía a decir en voz alta: ¿y si Teodoro, con 54 años, ya no podía aprender nada nuevo?',
check:{p:'¿Por qué una charla sola no basta para crear una conducta segura automática?', r:'Porque los hábitos se forman con repetición de la acción (ganglios basales y cerebelo). La charla da información; la práctica repetida con retroalimentación automatiza la conducta.'}},
{t:'Se aprende a cualquier edad', h:`
<p>La plasticidad dura toda la vida. Un adulto aprende algunas cosas más lento que un niño, pero tiene una ventaja enorme: <b>conocimiento previo</b> donde anclar lo nuevo.</p>
<p>Lo nuevo se graba mejor cuando se <b>conecta con algo que ya sabes</b>. Teodoro no necesitaba que le explicaran la física de una carga suspendida. Necesitaba que alguien le dijera: «¿te acuerdas del grillete de 2009? Esto es lo mismo, pero con la eslinga».</p>
<div class="callout amber"><b>Pregunta de oro para enseñar adultos:</b> "¿A qué se parece esto que ya conoces?"</div>`,
dato:'En el año 2000, Eleanor Maguire escaneó el cerebro de taxistas de Londres, que estudian unos cuatro años para memorizar 25 mil calles. Tenían más grande la parte posterior del hipocampo que el resto de personas, y cuantos más años de oficio, más grande. Años después, su equipo siguió a aprendices antes y después del examen: los que aprobaron mostraron ese crecimiento; los que abandonaron, no.',
tip:'Antes de enseñar algo a un veterano, pregúntale cómo lo hacía antes. Te da el ancla y, de paso, lo convierte en aliado en vez de juez.',
gancho:'Rosa ya sabía qué partes tenía el cerebro. Le faltaba entender el viaje completo de un recuerdo. Y el martes siguiente, un casi accidente se lo iba a enseñar.',
check:{p:'¿Cuál es la principal ventaja de un adulto al aprender algo nuevo?', r:'Su conocimiento previo: tiene más "ganchos" donde conectar la información nueva.'}}
],
claves:['Aprender = cambiar conexiones entre neuronas (plasticidad).','Lo que se usa se fortalece; lo que no se usa se debilita.','Hipocampo graba, amígdala marca lo emocional, prefrontal sostiene la atención.','Curiosidad y anticipación ayudan; miedo intenso bloquea.','Los hábitos se forman haciendo, no solo escuchando.'],
quiz:[
{t:'mc',d:true,p:'¿Qué significa "aprender" a nivel del cerebro?',o:['Llenar neuronas vacías con datos','Modificar las conexiones entre neuronas','Usar un porcentaje mayor del cerebro','Activar solo el hemisferio izquierdo'],c:1,e:'Aprender es plasticidad sináptica: fortalecer, crear o debilitar conexiones.'},
{t:'mc',d:true,p:'¿Qué zona participa más directamente en convertir lo vivido en un recuerdo duradero?',o:['Cerebelo','Hipocampo','Tronco encefálico','Corteza visual'],c:1,e:'El hipocampo registra la experiencia y ayuda a consolidarla en la corteza.'},
{t:'vf',p:'Según los experimentos de Schultz, la dopamina responde sobre todo a la anticipación y a la sorpresa, más que al premio en sí.',c:true,e:'Una vez aprendida la señal, la dopamina se dispara con la señal, antes del premio.'},
{t:'mc',p:'Un supervisor grita y humilla durante la capacitación. ¿Qué ocurre en el cerebro de los oyentes?',o:['Aprenden más rápido por la presión','El estrés alto bloquea la corteza prefrontal y aprenden peor','No hay efecto','Mejora la memoria a largo plazo de toda la charla'],c:1,e:'El estrés intenso apaga el razonamiento y la atención flexible; la gente se defiende en vez de aprender.'},
{t:'mc',p:'Según la regla de Hebb:',o:['Las neuronas que se activan juntas se conectan','Cada neurona guarda un recuerdo','El cerebro no cambia después de los 25 años','Solo se aprende durmiendo'],c:0,e:'"Neuronas que disparan juntas se conectan": la base del aprendizaje asociativo.'},
{t:'mc',p:'¿Qué demostró el estudio de los taxistas de Londres?',o:['Que manejar daña la memoria','Que el hipocampo crece con el entrenamiento intenso de la memoria espacial, incluso en adultos','Que los adultos no aprenden calles nuevas','Que la memoria es genética'],c:1,e:'La parte posterior del hipocampo era mayor y crecía con los años de oficio: plasticidad adulta.'},
{t:'mc',p:'¿Qué estructuras se encargan de automatizar habilidades y hábitos?',o:['Amígdala e hipocampo','Ganglios basales y cerebelo','Tálamo y retina','Corteza auditiva'],c:1,e:'Ganglios basales y cerebelo convierten acciones repetidas en rutinas automáticas.'},
{t:'mc',p:'¿Por qué el cerebro filtra y automatiza tanto?',o:['Porque es perezoso por naturaleza','Porque consume mucha energía (cerca del 20%) y necesita ahorrar','Porque solo usa el 10%','Por la edad'],c:1,e:'Pesa 2% y gasta cerca del 20% de la energía: filtrar y automatizar le ahorra recursos.'},
{t:'mc',p:'¿Qué región se dañó en Phineas Gage y qué función perdió en gran parte?',o:['Cerebelo: equilibrio','Corteza prefrontal: planificación y control de impulsos','Corteza visual: la vista','Hipocampo: memoria de largo plazo'],c:1,e:'La barra dañó la prefrontal; se volvió impulsivo y desorganizado.'}
],
cartas:[
{f:'¿Qué es la plasticidad?',b:'La capacidad del cerebro de cambiar sus conexiones con la experiencia. Es la base del aprendizaje.'},
{f:'Regla de Hebb',b:'Las neuronas que se activan juntas se conectan entre sí.'},
{f:'Función del hipocampo',b:'Registrar lo nuevo y ayudar a consolidarlo como recuerdo duradero.'},
{f:'Función de la amígdala',b:'Detectar lo emocional y lo amenazante, y marcar esos recuerdos como importantes.'},
{f:'Efecto del estrés intenso',b:'Bloquea la corteza prefrontal y perjudica al hipocampo: se aprende y se recuerda peor.'},

/* ================= MÓDULO 2 ================= */
{
id:'m2', icono:'💾', titulo:'Cómo se forma un recuerdo', sub:'De lo que oyes a lo que recuerdas meses después', min:14,
relato:{t:'Capítulo 2 · Dos testigos, dos verdades', h:`
<p class="drop">El martes, a las diez y doce de la mañana, una tubería de seis metros giró sola en el aire y rozó el pasamanos de la chata. No hubo heridos. Hubo dos testigos.</p>
<p>Wilder, el rigger más joven, juró que la tubería había girado porque el viento la empujó. Don Augusto, el vigía, juró que había girado porque nadie sujetaba el viento, la soga guía. Los dos estaban a cinco metros. Los dos vieron lo mismo. Los dos contaron una película distinta.</p>
<p>Rosa los entrevistó juntos, en el comedor, una hora después. Error. Al final de la conversación, Wilder ya decía «puede ser que la soga estaba suelta, ¿no?», y Don Augusto había agregado una ráfaga de viento que al principio no mencionó.</p>
<p>Esa noche, mientras llenaba el reporte, Rosa entendió algo incómodo. Si la memoria de dos hombres honestos se podía moldear en una hora de conversación, ¿qué quedaba de su charla de catorce minutos en la cabeza de veintiocho personas medio dormidas?</p>
<p>Abrió su laptop y escribió en el buscador: <i>cómo se forma un recuerdo</i>. Lo que encontró la tuvo despierta hasta la una.</p>`},
secciones:[
{t:'Las 5 etapas de un recuerdo', h:`
<p>Todo lo que aprendes recorre este camino. Toca cada etapa:</p>
<div data-widget="memoria"></div>
<div class="callout amber">Si una etapa falla, el recuerdo no llega. La charla de Rosa falló en la primera (nadie atendió) y en la cuarta (nadie repasó). Fallar en dos etapas de cinco es un examen jalado.</div>`,
dato:'En 1975, Godden y Baddeley pusieron a buzos a memorizar palabras en tierra o bajo el agua. Recordaban mejor cuando el examen se hacía en el mismo lugar donde aprendieron. El contexto se graba junto con el recuerdo y luego sirve de llave para recuperarlo.',
tip:'Da la charla en el lugar donde ocurrirá la conducta. Una charla de izaje junto a la grúa deja más llaves de recuerdo que la misma charla en el comedor.',
gancho:'La primera etapa tiene trampa: la mesa donde trabajas los recuerdos es ridículamente pequeña.',
check:{p:'Nombra las 5 etapas en orden.', r:'Atención → Memoria de trabajo → Codificación → Consolidación → Recuperación.'}},
{t:'Memoria de trabajo: una mesa pequeña', h:`
<p>La memoria de trabajo es tu mesa de trabajo mental. Ahí sostienes lo que piensas ahora mismo. Problema: <b>es pequeña</b>. La mayoría de personas maneja unas <b>4 unidades</b> a la vez.</p>
<p>Rosa puso once normas sobre esa mesa en catorce minutos. Las primeras se cayeron al piso antes de que llegara la sexta.</p>
<div class="callout cyan"><b>Truco: agrupa (chunking).</b> Un celular de 9 dígitos se recuerda como 3 grupos de 3. Diez normas se recuerdan mejor como 3 grupos: "antes, durante y después de la maniobra".</div>`,
dato:'En 1973, Chase y Simon mostraron tableros de ajedrez durante 5 segundos. Los maestros reconstruían casi todas las piezas; los novatos, unas pocas. Pero cuando las piezas se colocaban al azar, sin lógica de partida, los maestros recordaban igual de poco que los novatos. Su ventaja estaba en agrupar: veían "jugadas" donde el novato veía piezas sueltas.',
tip:'Ponle nombre corto a cada grupo de ideas ("las 3 M: mira, mide, muévete"). Un grupo con nombre ocupa un solo espacio en la mesa.',
gancho:'Lo que sobrevive a la mesa se guarda en tres archivadores distintos. Y uno de ellos no entiende palabras.',
check:{p:'¿Cuántas unidades de información sostiene la memoria de trabajo, aproximadamente?', r:'Alrededor de 4. Por eso conviene agrupar la información en bloques.'}},
{t:'Tipos de memoria a largo plazo', h:`
<ul>
<li><b>Episódica:</b> lo que te pasó ("el día que giró la tubería").</li>
<li><b>Semántica:</b> datos y conceptos ("la carga máxima de esta eslinga es 2 t").</li>
<li><b>Procedimental:</b> cómo se hace algo ("colocarse el arnés"). Se aprende <b>haciendo</b> y casi no se puede explicar con palabras.</li>
</ul>
<div class="callout amber"><b>Consecuencia directa:</b> una habilidad (amarrar, inspeccionar, usar un extintor) exige práctica. Una exposición oral solo crea memoria semántica: el trabajador "sabe" pero no "sabe hacer".</div>
<div class="callout cyan">Las historias activan la memoria episódica, que es más rica y más fácil de recuperar que un dato suelto. Por eso Teodoro recuerda el grillete y olvida la norma.</div>`,
dato:'En 1953, para curar su epilepsia, a Henry Molaison le extirparon ambos hipocampos. Desde ese día no pudo formar recuerdos nuevos de hechos: trató con los mismos investigadores durante décadas y cada vez los saludaba como a desconocidos. La psicóloga Brenda Milner le pidió dibujar una estrella mirando solo su reflejo en un espejo. Día tras día, mejoró como cualquiera. Y cada día juraba que nunca lo había intentado. Su mano aprendía; su mente no se enteraba.',
tip:'Para habilidades, la mitad del tiempo de la capacitación debe ser práctica con las manos. Si no hay tiempo para practicar, no prometas que aprendieron la habilidad.',
gancho:'Ahora viene la parte cruel: cuánto se pierde, y en cuánto tiempo.',
check:{p:'¿Qué tipo de memoria necesitas para que alguien sepa colocarse bien un arnés?', r:'Procedimental. Se construye practicando la acción con retroalimentación, no solo escuchando.'}},
{t:'La curva del olvido', h:`
<p>En 1885, Hermann Ebbinghaus se usó a sí mismo como conejillo de Indias. Midió cuánto olvidaba con el tiempo y encontró que <b>la mayor pérdida ocurre en las primeras horas y días</b>. Después, la caída se vuelve más lenta.</p>
<div data-widget="olvido"></div>
<p>Cada vez que <b>recuperas</b> la información (no cuando la relees), la curva se aplana. Con 3 o 4 repasos espaciados el recuerdo dura meses.</p>`,
dato:'El psicólogo ruso Alexander Luria estudió durante 30 años a Solomón Shereshevski, un periodista que no podía olvidar: recordaba listas de cientos de palabras años después. Parece un superpoder, pero le arruinaba la vida. No podía distinguir lo importante de lo trivial, y le costaba entender metáforas porque cada palabra le traía una imagen imposible de borrar. Olvidar es una función útil: limpia la mesa para lo que importa.',
tip:'El repaso que más rinde es el primero, al día siguiente. Una pregunta de 1 minuto en la charla del día siguiente ("¿qué dijimos ayer de la soga guía?") vale más que media hora un mes después.',
gancho:'Hay un repaso que ocurre sin que hagas nada. Sucede todas las noches, mientras roncas.',
check:{p:'¿Cuándo ocurre la mayor pérdida de lo aprendido?', r:'En las primeras horas y días después de aprenderlo. Por eso el primer repaso conviene hacerlo pronto (al día siguiente).'}},
{t:'Dormir para recordar', h:`
<p>Durante el sueño profundo, el hipocampo <b>"reproduce"</b> lo vivido en el día y lo transfiere a la corteza. Así se consolida el recuerdo y se conecta con lo que ya sabías.</p>
<ul>
<li>Quien duerme mal, consolida mal.</li>
<li>El sueño después de aprender importa tanto como el sueño antes.</li>
</ul>
<div class="callout cyan"><b>⛑️ En campo:</b> evita programar una capacitación importante al final de un turno nocturno o tras una jornada pesada bajo el sol. El cerebro fatigado atiende y graba peor.</div>`,
dato:'En 1994, Wilson y McNaughton registraron neuronas del hipocampo de ratas que recorrían un laberinto. Cada lugar activaba una secuencia de neuronas. Cuando las ratas dormían, esas mismas secuencias volvían a dispararse en el mismo orden, como si repasaran el recorrido. Las ratas literalmente sueñan con el laberinto.',
tip:'Si das una capacitación importante, procura que haya una noche de sueño antes del examen o la práctica final. Evaluar el mismo día mide lo que entró, no lo que se quedó.',
gancho:'Y aquí volvemos a Wilder y Don Augusto. Porque cuando el recuerdo vuelve, no vuelve intacto.',
check:{p:'¿Qué hace el cerebro con lo aprendido mientras duermes?', r:'Lo consolida: el hipocampo reproduce lo vivido y lo transfiere y conecta con la corteza.'}},
{t:'Recordar es reconstruir', h:`
<p>Un recuerdo no se guarda como un video. Cada vez que recuerdas, tu cerebro <b>lo reconstruye</b> con piezas sueltas, y en ese proceso puede deformarlo, llenar huecos o mezclarlo con lo que otros dijeron.</p>
<p>Wilder no mintió cuando empezó a dudar de la soga. Su cerebro rellenó un hueco con la versión de Don Augusto, y la versión nueva se sintió igual de real que la original.</p>
<div class="callout amber"><b>⛑️ Aplicación en investigación de incidentes:</b>
<ul><li>Entrevista a los testigos lo antes posible y por separado.</li>
<li>Empieza con preguntas abiertas ("cuéntame qué viste").</li>
<li>Evita preguntas que sugieran ("¿el operador iba rápido, verdad?").</li></ul></div>`,
dato:'En 1974, Elizabeth Loftus y John Palmer mostraron videos de choques de autos. Luego preguntaron: «¿a qué velocidad iban los autos cuando se estrellaron?». A otro grupo le cambiaron solo el verbo: «cuando se tocaron». Los del verbo "estrellaron" calcularon velocidades unos 14 km/h más altas. Una semana después, en el grupo del verbo "estrellaron" hubo más del doble de personas que recordaban vidrios rotos, que nunca aparecieron en el video.',
tip:'En la entrevista a testigos, usa verbos neutros: "¿qué pasó con la tubería?" en vez de "¿cómo golpeó la tubería?". Cada palabra tuya puede quedar grabada en su recuerdo.',
gancho:'Rosa cerró la laptop a la una de la mañana con una certeza: sabía por qué había fallado. Ahora necesitaba saber qué funciona. Y la respuesta la encontró, de todos los lugares posibles, en el cuaderno de su sobrino.',
check:{p:'¿Por qué conviene entrevistar a los testigos de un incidente pronto y por separado?', r:'Porque la memoria se reconstruye cada vez y puede contaminarse con el tiempo y con lo que dicen otros.'}}
],
claves:['Atención → trabajo → codificación → consolidación → recuperación.','La memoria de trabajo sostiene unas 4 cosas: agrupa.','Las habilidades necesitan memoria procedimental: práctica.','La mayor parte del olvido ocurre en los primeros días.','El sueño consolida; el recuerdo se reconstruye cada vez.','El contexto donde aprendes sirve de llave para recordar.'],
quiz:[
{t:'orden',d:true,p:'Ordena las etapas de formación de un recuerdo:',items:['Atención','Memoria de trabajo','Codificación','Consolidación','Recuperación'],e:'Sin atención nada entra; sin consolidación nada dura; sin recuperación no lo usas.'},
{t:'mc',d:true,p:'En una charla de 5 minutos das 10 normas seguidas. ¿Qué es lo más probable?',o:['Las recordarán todas','Recordarán pocas porque la memoria de trabajo sostiene unas 4 cosas','Recordarán solo las del medio','Depende del estilo de aprendizaje de cada uno'],c:1,e:'La memoria de trabajo es limitada: hay que priorizar y agrupar.'},
{t:'mc',p:'Henry Molaison mejoró al dibujar en espejo, pero no recordaba haberlo practicado. ¿Qué demuestra?',o:['Que mentía','Que la memoria procedimental funciona aparte de la memoria de hechos','Que el hipocampo controla los movimientos','Que dibujar no requiere memoria'],c:1,e:'Sin hipocampo no formaba recuerdos de hechos, pero su memoria procedimental seguía aprendiendo.'},
{t:'vf',p:'Según la curva del olvido, la mayor pérdida de información ocurre en las primeras horas y días.',c:true,e:'La pendiente es máxima al inicio; luego se estabiliza.'},
{t:'mc',p:'¿Qué aplana más la curva del olvido?',o:['Releer la presentación varias veces','Recuperar la información de memoria en repasos espaciados','Subrayar con colores','Escuchar la misma charla grabada'],c:1,e:'La recuperación activa y espaciada fortalece el recuerdo mucho más que releer.'},
{t:'mc',p:'Los maestros de ajedrez recuerdan tableros de partidas reales, pero no tableros al azar. ¿Por qué?',o:['Tienen mejor vista','Agrupan las piezas en patrones con sentido (chunking)','Tienen más neuronas','Por suerte'],c:1,e:'Su ventaja es agrupar en patrones; sin patrones, la mesa es igual de pequeña para todos.'},
{t:'vf',p:'Un recuerdo funciona como un video fiel que se reproduce igual cada vez.',c:false,e:'Se reconstruye cada vez y puede deformarse.'},
{t:'mc',p:'¿Cuál es la mejor práctica al entrevistar testigos de un incidente?',o:['Reunirlos para que se pongan de acuerdo','Preguntar "¿iba rápido, verdad?" para ir al grano','Entrevistarlos pronto, por separado y con preguntas abiertas','Esperar una semana a que se calmen'],c:2,e:'Así reduces la contaminación de la memoria reconstructiva.'},
{t:'mc',p:'Los buzos de Godden y Baddeley recordaban mejor en el mismo lugar donde aprendieron. ¿Qué aplicas en SST?',o:['Capacitar siempre en el comedor','Dar la charla en el lugar donde ocurrirá la conducta','Capacitar bajo el agua','Cambiar de lugar cada día'],c:1,e:'El contexto se graba con el recuerdo y luego ayuda a recuperarlo.'}
],
cartas:[
{f:'Las 5 etapas del recuerdo',b:'Atención, memoria de trabajo, codificación, consolidación y recuperación.'},
{f:'Capacidad de la memoria de trabajo',b:'Alrededor de 4 unidades. Agrupa la información en bloques.'},
{f:'Memoria procedimental',b:'Guarda cómo se hacen las cosas. Se aprende practicando. Caso H.M.: aprendía con la mano sin recordarlo.'},

{f:'Memoria dependiente del contexto',b:'Se recuerda mejor en el lugar donde se aprendió (buzos de Godden y Baddeley).'}
]

/* ================= MÓDULO 3 ================= */
{
id:'m3', icono:'🛠️', titulo:'Estrategias que sí funcionan', sub:'Lo que la ciencia demuestra para aprender mejor', min:14,
relato:{t:'Capítulo 3 · El cuaderno del sobrino', h:`
<p class="drop">Rosa había estudiado toda su vida de la misma manera: resaltador amarillo, tres relecturas, café. Así sacó su título, así preparó la charla que nadie recordó, y así se preparaba, durante su descanso en Iquitos, para el examen de una certificación en gestión de riesgos.</p>
<p>Tres semanas resaltando. El libro parecía un plátano maduro. Se sentía segura. Lo sabía todo.</p>
<p>Jaló el examen con 11.</p>
<p>Esa tarde, en la casa de su hermana en Punchana, su sobrino Kevin, de catorce años, estudiaba para un examen de ciencias con una cajita de zapatos llena de tarjetas. Leía la pregunta, cerraba los ojos, decía la respuesta en voz alta, volteaba la tarjeta. Si acertaba, la tarjeta pasaba a otro compartimiento. Si fallaba, volvía al primero.</p>
<p class="dlg">«¿Y eso quién te enseñó?», le preguntó Rosa, entre burlona y picada.</p>
<p class="dlg">«Mi profesora de biología. Dice que releer es para flojos, tía.»</p>
<p>Rosa se rió. Al día siguiente buscó en internet si la profesora tenía razón. Tenía razón. Y la evidencia era tan contundente que le dio vergüenza haber llegado a los treinta y dos años sin saberlo.</p>`},
secciones:[
{t:'Los 4 pilares del aprendizaje', h:`
<p>El neurocientífico francés Stanislas Dehaene resume décadas de investigación en <b>4 pilares</b>. Si falta uno, el aprendizaje cojea:</p>
<div class="pillars">
<div><b>1. Atención</b><span>Lo que no se atiende no se procesa.</span></div>
<div><b>2. Compromiso activo</b><span>El cerebro pasivo apenas aprende. Hay que pensar, predecir, responder.</span></div>
<div><b>3. Retroalimentación del error</b><span>Equivocarse y saber por qué corrige el modelo mental.</span></div>
<div><b>4. Consolidación</b><span>Repetición espaciada y sueño convierten lo frágil en duradero.</span></div>
</div>
<p>La cajita de Kevin cumplía los cuatro. El resaltador de Rosa, apenas el primero, y a medias.</p>`,
dato:'Los bebés de pocos meses ya aplican el pilar 3. En experimentos de "violación de expectativa", miran más tiempo una escena imposible (un juguete que atraviesa una pared) que una posible. El cerebro humano viene programado para prestar atención a sus propios errores de predicción.',
tip:'En cada charla, pide al público que prediga antes de explicar: "¿qué creen que pasa si la eslinga roza esta arista?". Predecir activa el compromiso y prepara al cerebro para el error.',
gancho:'De los cuatro pilares, hay una técnica que los activa todos a la vez. Y es la que Kevin usaba sin saber su nombre.',
check:{p:'¿Cuáles son los 4 pilares del aprendizaje según Dehaene?', r:'Atención, compromiso activo, retroalimentación del error y consolidación.'}},
{t:'Práctica de recuperación', h:`
<p>Sacar la información de tu cabeza la fortalece más que volver a meterla. A esto se le llama <b>efecto de prueba</b>.</p>
<p>En un estudio clásico (Roediger y Karpicke, 2006), quienes se autoevaluaron recordaban bastante más a la semana que quienes releyeron el texto. Y aquí viene lo cruel: los que releían <b>se sentían más seguros</b>. Igual que Rosa antes de jalar.</p>
<div class="callout amber"><b>Ilusión de fluidez:</b> releer se siente fácil y por eso parece que ya lo sabes. Que algo te resulte familiar no significa que puedas recordarlo cuando lo necesitas.</div>
<p><b>Cómo aplicarlo:</b> cierra el material y pregúntate. Usa tarjetas. En una charla, pregunta en vez de repetir.</p>`,
dato:'Decir las cosas en voz alta ayuda a recordarlas. Colin MacLeod y su equipo llamaron a esto "efecto de producción" (2010): las palabras leídas en voz alta se recordaban mejor que las leídas en silencio. Kevin no solo usaba tarjetas: además decía la respuesta en voz alta.',
tip:'Cierra cada charla con una ronda de 30 segundos: dos o tres personas dicen en voz alta la idea principal. Recuperación + producción en un solo movimiento.',
gancho:'Kevin tenía un segundo secreto en la cajita de zapatos: los compartimientos.',
check:{p:'¿Por qué releer da una falsa sensación de dominio?', r:'Por la ilusión de fluidez: el material se siente familiar, pero reconocer no es lo mismo que poder recuperarlo de memoria.'}},
{t:'Repaso espaciado', h:`
<p>Diez repasos en una noche rinden menos que cuatro repasos distribuidos en un mes. Espaciar obliga al cerebro a "rescatar" el recuerdo justo cuando empieza a olvidarlo, y eso lo fortalece.</p>
<div class="callout cyan"><b>Regla práctica:</b> repasa al día siguiente, a los 3 días, a la semana y al mes.</div>
<p>La sección <b>Repasar</b> de esta app funciona como la cajita de Kevin: 5 cajas. Si aciertas, la tarjeta sube de caja y vuelve más tarde. Si fallas, regresa a la caja 1.</p>
<div class="callout amber"><b>⛑️ En campo:</b> en lugar de una charla de 30 minutos sobre línea de fuego, da 4 charlas de 5 minutos en el mes que retomen la misma idea con casos distintos.</div>`,
dato:'El sistema de la cajita lo inventó en 1972 un periodista alemán, Sebastian Leitner, en un libro de autoayuda llamado algo así como "Así se aprende a aprender". No era científico. Décadas después, los experimentos confirmaron que su intuición era correcta, y hoy la usan aplicaciones de idiomas con millones de usuarios.',
tip:'Usa tu programa mensual de charlas como un sistema Leitner: el tema crítico del mes aparece en la semana 1, se retoma con una pregunta en la semana 2 y con un caso nuevo en la semana 4.',
gancho:'Hasta aquí, todo suena razonable. Lo siguiente va contra la intuición: a veces conviene que aprender cueste más.',
check:{p:'¿Qué rinde más: 10 repasos en una noche o 4 repasos distribuidos en un mes?', r:'Los 4 repasos distribuidos. El espaciado obliga a recuperar justo cuando se empieza a olvidar.'}},
{t:'Intercalar y elaborar', h:`
<p><b>Intercalar:</b> mezclar tipos de problemas en la práctica (eslingas, grilletes, ganchos) en vez de practicar todo de un tipo y luego todo del otro. Cuesta más en el momento, pero enseña a <b>distinguir cuándo aplicar qué</b>.</p>
<p><b>Elaborar:</b> preguntarte "¿por qué?" y "¿cómo se conecta con lo que ya sé?". Cada conexión es un gancho más para recuperar el recuerdo.</p>
<div class="callout amber"><b>Dificultades deseables</b> (término de Robert Bjork): lo que cuesta un poco más al aprender (recuperar, espaciar, intercalar) suele durar más. Lo que se siente fácil se olvida rápido.</div>`,
dato:'Taylor y Rohrer (2010) entrenaron a niños en problemas de matemáticas. Un grupo practicó por bloques (todos los de un tipo, luego los del otro); otro grupo, mezclados. Durante la práctica, el grupo por bloques parecía ir mejor. En el examen del día siguiente, el grupo intercalado sacó más del doble de aciertos.',
tip:'En la práctica de inspección, mezcla en la mesa accesorios buenos y dañados de distintos tipos. Que el trabajador tenga que decidir "¿esto pasa o no pasa?" en cada uno.',
gancho:'Kevin también dibujaba en sus tarjetas. Monigotes, flechas, una célula con cara. Rosa pensó que era distracción. Se equivocaba.',
check:{p:'¿Qué es una "dificultad deseable"?', r:'Un esfuerzo extra al aprender (recuperar, espaciar, intercalar) que hace el proceso más lento en el momento, pero el recuerdo más duradero.'}},
{t:'Palabra + imagen', h:`
<p>El cerebro procesa palabras e imágenes por canales en parte distintos. Cuando combinas ambos, creas <b>dos rutas</b> hacia el mismo recuerdo (codificación dual, Allan Paivio).</p>
<ul>
<li>Muestra el objeto real o una foto mientras lo explicas.</li>
<li>Dibuja un esquema simple en la pizarra.</li>
<li>Usa <b>ejemplos concretos</b> antes de la regla abstracta.</li>
</ul>
<div class="callout cyan">Esto sirve a <b>todas</b> las personas. No tiene relación con los "estilos de aprendizaje" (verás por qué en el módulo de mitos).</div>`,
dato:'En 1973, Lionel Standing mostró 10 000 fotografías a voluntarios, una tras otra, durante varios días. Después les presentó pares de fotos: una vista y una nueva. Reconocieron la correcta en más del 80% de los casos. Con palabras sueltas, el rendimiento fue claramente menor. Los psicólogos lo llaman "efecto de superioridad de la imagen".',
tip:'Toma fotos de condiciones reales de tu propia área (con permiso) y úsalas en las charlas. Una foto del muelle que conocen vale más que diez imágenes de internet.',
gancho:'Falta un ingrediente, el más delicado. Rosa lo descubrió el día que se equivocó delante de todos.',
check:{p:'¿Por qué conviene combinar palabras e imágenes?', r:'Porque se crean dos rutas de memoria (verbal y visual) hacia la misma idea, y eso facilita recuperarla.'}},
{t:'Emoción, error y seguridad psicológica', h:`
<p>La <b>emoción moderada</b> ayuda: la amígdala avisa al hipocampo "esto importa, guárdalo". Por eso recuerdas dónde estabas en momentos fuertes.</p>
<p>El <b>miedo intenso</b> bloquea: la persona aterrada se enfoca en protegerse y deja de razonar.</p>
<p>El <b>error</b> es información valiosa para el cerebro (pilar 3). Pero si equivocarse trae burla o castigo, la gente oculta sus dudas y sus errores.</p>
<div class="callout amber"><b>⛑️ En campo:</b> agradece la pregunta "tonta" en público. Cada duda que alguien se calla en la charla es un riesgo que se va al frente de trabajo.</div>`,
dato:'Butterfield y Metcalfe (2001) descubrieron el "efecto de hipercorrección": los errores cometidos con mucha seguridad se corrigen mejor que los cometidos con duda, siempre que la persona reciba la respuesta correcta. La sorpresa de "¡estaba seguro y me equivoqué!" graba la corrección con fuerza.',
tip:'Usa preguntas trampa en tus charlas, donde la respuesta "obvia" está mal ("¿una eslinga con un hilo roto todavía sirve?"). Cuando el veterano falla con seguridad y escucha la explicación, ya no la olvida. Hazlo con humor, nunca con burla.',
gancho:'Con los pilares claros, Rosa se sintió lista. Hasta que asistió a la capacitación de un consultor que llegó de Lima con una presentación impecable y tres mentiras.',
check:{p:'¿Por qué es peligroso que el personal tenga miedo de preguntar en una capacitación?', r:'Porque oculta sus dudas y errores; el error no corregido se convierte en una conducta insegura en campo.'}}
],
claves:['Atención, compromiso activo, retroalimentación del error y consolidación.','Recuperar fortalece más que releer; en voz alta, mejor.','Espaciar los repasos vence a la curva del olvido.','Intercalar y elaborar crean recuerdos flexibles.','Palabra + imagen = dos rutas de memoria.','Emoción moderada ayuda; miedo y burla bloquean.'],
quiz:[
{t:'mc',d:true,p:'¿Qué técnica de estudio tiene más respaldo científico para recordar a largo plazo?',o:['Releer y subrayar','Práctica de recuperación espaciada','Escuchar música mientras estudias','Estudiar toda la noche anterior'],c:1,e:'Recuperar de memoria y espaciar los repasos son de las técnicas más sólidas.'},
{t:'mc',d:true,p:'¿Cuál NO es uno de los 4 pilares del aprendizaje de Dehaene?',o:['Atención','Compromiso activo','Estilo de aprendizaje preferido','Consolidación'],c:2,e:'Los pilares son atención, compromiso activo, retroalimentación del error y consolidación.'},
{t:'vf',p:'Quienes releen un texto suelen sentirse más seguros de lo que realmente recuerdan.',c:true,e:'Es la ilusión de fluidez: familiar no significa recuperable.'},
{t:'mc',p:'Quieres que tu equipo recuerde "línea de fuego" todo el año. ¿Qué plan es mejor?',o:['Una charla larga de 1 hora en enero','4 charlas cortas espaciadas con casos distintos','Un afiche en el comedor','Enviar el procedimiento por correo'],c:1,e:'Espaciado + variedad de casos + recuperación.'},
{t:'mc',p:'Practicar mezclando eslingas, grilletes y ganchos en vez de un tema por bloque se llama:',o:['Intercalado','Chunking','Multitarea','Memoria sensorial'],c:0,e:'El intercalado enseña a distinguir qué aplicar en cada caso.'},
{t:'vf',p:'Combinar palabra e imagen solo beneficia a las personas "visuales".',c:false,e:'La codificación dual beneficia a todos.'},
{t:'mc',p:'El efecto de hipercorrección dice que:',o:['Los errores cometidos con mucha seguridad se corrigen mejor al recibir la respuesta correcta','Corregir errores daña la autoestima','Nunca se debe mostrar el error','Los errores con duda se graban más'],c:0,e:'La sorpresa de equivocarse estando seguro refuerza la corrección.'},
{t:'mc',p:'Un trabajador se equivoca al responder en la charla. La mejor reacción es:',o:['Corregirlo con burla para que no lo olvide','Ignorar el error','Agradecer, explicar el porqué de la respuesta correcta y seguir','Pedirle que no hable más'],c:2,e:'Retroalimentación del error en un ambiente seguro: así se corrige el modelo mental.'},
{t:'vf',p:'Leer o decir la información en voz alta ayuda a recordarla mejor que leerla en silencio.',c:true,e:'Es el efecto de producción (MacLeod, 2010).'}
],
cartas:[
{f:'4 pilares de Dehaene',b:'Atención, compromiso activo, retroalimentación del error y consolidación.'},
{f:'Efecto de prueba',b:'Recuperar información de memoria la fortalece más que releerla.'},
{f:'Ilusión de fluidez',b:'Sentir que sabes algo porque te resulta familiar, aunque no puedas recordarlo solo.'},
{f:'Calendario de repaso práctico',b:'Al día siguiente, a los 3 días, a la semana y al mes.'},
{f:'Dificultades deseables (Bjork)',b:'Esfuerzos que hacen más lento el aprendizaje en el momento pero más duradero: recuperar, espaciar, intercalar.'},
{f:'Efecto de superioridad de la imagen',b:'Las imágenes se reconocen mucho mejor que las palabras (Standing: 10 000 fotos, más del 80% reconocidas).'},
{f:'Efecto de hipercorrección',b:'Un error cometido con mucha seguridad, una vez corregido, se recuerda con fuerza.'}
]
},

/* ================= MÓDULO 4 ================= */
{
id:'m4', icono:'🚫', titulo:'Mitos que debes dejar de repetir', sub:'Ideas populares sin respaldo y qué hacer en su lugar', min:12,
relato:{t:'Capítulo 4 · El consultor de Lima', h:`
<p class="drop">El consultor llegó en la avioneta del jueves con camisa celeste planchada, una laptop plateada y la seguridad de quien ha dado la misma presentación doscientas veces. Se llamaba Renzo. Cobraba por hora una cifra que Rosa prefirió no calcular.</p>
<p>A los tres minutos proyectó una pirámide de colores. «Recordamos el 10% de lo que leemos y el 90% de lo que hacemos», dijo, y los veinte supervisores asintieron como quien escucha el Padre Nuestro.</p>
<p>A los ocho minutos explicó que «solo el 7% de la comunicación son palabras». A los doce, que «solo usamos el 10% del cerebro». A los quince, que había que identificar si cada trabajador era visual, auditivo o kinestésico.</p>
<p>Un mes antes, Rosa habría tomado nota de todo. Esta vez sintió algo raro en el estómago, una mezcla de vergüenza ajena y placer culpable. Porque acababa de leer de dónde salía cada una de esas frases. Y ninguna salía de donde Renzo creía.</p>
<p>No dijo nada. Esperó el break, se sirvió una galleta de soda, y se acercó al consultor con la sonrisa más amable que tenía.</p>
<p class="dlg">«Renzo, una consulta. Lo de la pirámide, ¿de qué estudio sale?»</p>
<p>Renzo masticó despacio. Muy despacio.</p>`},
secciones:[
{t:'Mito: "Cada uno tiene su estilo de aprendizaje"', h:`
<p class="myth">❌ "Hay personas visuales, auditivas y kinestésicas, y aprenden mejor si les enseñas en su estilo."</p>
<p><b>Lo que dice la evidencia:</b> las personas sí tienen preferencias, pero enseñar según esa preferencia <b>no mejora</b> lo que aprenden (revisión de Pashler y colegas, 2008, y estudios posteriores).</p>
<div class="callout cyan"><b>Haz esto:</b> elige el formato según el <b>contenido</b>. Una maniobra se enseña mostrando y practicando; un plano, con imagen; una norma, con palabras y ejemplo. Combina canales para todos.</div>`,
dato:'En encuestas a docentes de distintos países, cerca de 9 de cada 10 dicen creer que enseñar según el estilo de aprendizaje mejora los resultados (Newton y Salvi, 2020). Es probablemente el neuromito más extendido del mundo educativo, y también entre capacitadores de empresa.',
tip:'Cuando alguien te diga "es que yo soy visual", respóndele con lo que sí sirve: "perfecto, todos aprendemos mejor con imagen y palabra juntas".',
gancho:'Renzo, acorralado, cambió de tema hacia la pirámide. Mala idea.',
check:{p:'¿Qué decide el mejor formato para enseñar algo: el estilo del alumno o el tipo de contenido?', r:'El tipo de contenido. Enseñar según el "estilo" preferido no mejora el aprendizaje.'}},
{t:'Mito: "La pirámide del aprendizaje"', h:`
<p class="myth">❌ "Recordamos 10% de lo que leemos, 20% de lo que oímos... y 90% de lo que hacemos."</p>
<p><b>Lo que dice la evidencia:</b> esos porcentajes <b>no salen de ningún estudio</b>. Los números redondos, que crecen de 10 en 10 sin un solo decimal, delatan el invento. Se atribuye por error al "cono de la experiencia" de Edgar Dale (1946), que no tenía ni un porcentaje.</p>
<div class="callout cyan"><b>Haz esto:</b> no cites esos números. La idea útil detrás es cierta en parte: el compromiso activo ayuda. Dilo así, sin cifras inventadas.</div>`,
dato:'Investigadores que rastrearon el origen de la pirámide encontraron versiones con porcentajes distintos en distintas fuentes, y ninguna con un estudio detrás. Una señal de alerta universal: cuando una cifra sobre el cerebro es demasiado redonda y demasiado perfecta, sospecha.',
tip:'Antes de usar un dato en una capacitación, hazte una pregunta: "¿quién lo midió, cuándo y con cuántas personas?". Si no puedes responder, no lo uses.',
gancho:'El siguiente mito tiene película de Hollywood y todo.',
check:{p:'¿De dónde salen los porcentajes de la "pirámide del aprendizaje"?', r:'De ningún estudio. Son cifras inventadas y mal atribuidas al cono de Edgar Dale.'}},
{t:'Mito: "Solo usamos el 10% del cerebro"', h:`
<p class="myth">❌ "Si activaras el 90% restante, serías un genio."</p>
<p><b>Lo que dice la evidencia:</b> las neuroimágenes muestran actividad en prácticamente todo el cerebro a lo largo del día. Una lesión pequeña en casi cualquier zona produce algún déficit. Y un órgano que gasta el 20% de tu energía no podría darse el lujo de tener un 90% de vacaciones.</p>`,
dato:'El mito inspiró la película "Lucy" (2014), donde Scarlett Johansson desbloquea el 100% de su cerebro y adquiere superpoderes. Otro mito pariente: el "efecto Mozart". Un estudio de 1993 encontró una mejora pequeña y pasajera en una tarea espacial tras escuchar Mozart. Bastó para que en 1998 el gobernador del estado de Georgia, en EE. UU., propusiera regalar discos de música clásica a cada recién nacido. Los estudios posteriores no encontraron que Mozart vuelva más inteligente a nadie.',
tip:'Si alguien en tu equipo cita uno de estos mitos, no lo humilles en público. Pregúntale con curiosidad de dónde lo sacó. Aplica la seguridad psicológica que aprendiste.',
gancho:'El cuarto mito divide a la gente en dos bandos. Rosa siempre se creyó del bando "creativo".',
check:{p:'Da una razón por la que el mito del 10% es falso.', r:'Las neuroimágenes muestran actividad en casi todo el cerebro, y lesiones en casi cualquier zona causan déficits.'}},
{t:'Mito: "Cerebro izquierdo y cerebro derecho"', h:`
<p class="myth">❌ "Las personas lógicas usan el hemisferio izquierdo y las creativas el derecho."</p>
<p><b>Lo que dice la evidencia:</b> algunas funciones se apoyan más en un lado (el lenguaje, en la mayoría, a la izquierda), pero un estudio con más de 1000 cerebros (Nielsen y colegas, 2013) no encontró personas "de hemisferio izquierdo" ni "de hemisferio derecho". Ambos lados trabajan juntos todo el tiempo.</p>`,
dato:'La idea viene de un descubrimiento real que ganó el Nobel en 1981: Roger Sperry estudió pacientes a quienes se les había cortado el puente entre hemisferios para tratar epilepsia grave. En ellos, cada mitad funcionaba por separado con habilidades distintas. La cultura popular tomó ese hallazgo en pacientes muy especiales y lo convirtió en un test de personalidad para todos.',
tip:'Desconfía de cualquier test que te clasifique en un "tipo de cerebro". El cerebro funciona en red, y las etiquetas limitan más de lo que ayudan.',
gancho:'El quinto mito es el favorito de los cursos de oratoria. Y fue el que hizo que Renzo dejara de masticar.',
check:{p:'¿Existen personas "de hemisferio derecho" o "de hemisferio izquierdo"?', r:'No. Hay funciones lateralizadas, pero las personas usan ambos hemisferios en conjunto.'}},
{t:'Mito: "El 93% de la comunicación es no verbal"', h:`
<p class="myth">❌ "Solo el 7% del mensaje son palabras, 38% el tono y 55% el cuerpo."</p>
<p><b>Lo que dice la evidencia:</b> Albert Mehrabian estudió en los años 60 un caso muy específico: cómo juzgamos <b>sentimientos</b> cuando las palabras <b>contradicen</b> el tono o la expresión. Usó palabras sueltas, grabadas, y fotos. Él mismo aclara que esas cifras no se aplican a la comunicación en general.</p>
<div class="callout cyan"><b>Lo útil que sí queda:</b> cuando tus palabras dicen una cosa y tu cuerpo otra, el público cree al cuerpo. Busca coherencia. Y en una charla técnica, las palabras importan muchísimo.</div>`,
dato:'Haz la prueba que propone la lógica: si solo el 7% fuera palabras, podrías ver una película en un idioma que no conoces y entender el 93% de la trama. Nadie lo logra. Mehrabian pasó años aclarando en entrevistas y en su propia página web que su fórmula se usa mal.',
tip:'Usa el hallazgo real a tu favor: si vas a decir "esto es grave", que tu cara, tu ritmo y tu pausa también lo digan. La incoherencia hace que el mensaje pierda fuerza.',
gancho:'El sexto mito habla de peces dorados. Spoiler: el pez sale mejor parado que el mito.',
check:{p:'¿A qué situación se aplica realmente la regla 7-38-55 de Mehrabian?', r:'A juzgar sentimientos o actitudes cuando las palabras contradicen el tono o el lenguaje corporal. No a toda comunicación.'}},
{t:'Mito: "La atención dura 8 segundos" o "exactamente 10 minutos"', h:`
<p class="myth">❌ "Tenemos menos atención que un pez dorado." / "A los 10 minutos todos se desconectan."</p>
<p><b>Lo que dice la evidencia:</b> la cifra del pez dorado salió de un informe de marketing de 2015 sin estudio que la respalde. La "regla de los 10 minutos" tampoco tiene un respaldo sólido: la atención <b>fluctúa</b> según el interés, la fatiga, el ambiente y lo que hace el expositor.</p>
<div class="callout cyan"><b>Haz esto:</b> en vez de temer al reloj, cambia de actividad con frecuencia (pregunta, muestra un objeto, pide una demostración). Cada cambio reinicia la atención.</div>`,
dato:'Los peces dorados recuerdan bastante más que 3 segundos. En experimentos, se les entrenó a acudir a un sonido o a empujar una palanca para recibir comida, y conservaban lo aprendido durante semanas o meses. El pez dorado fue difamado dos veces: por su memoria y por su atención.',
tip:'Planifica tu charla en bloques de pocos minutos con un "reinicio" entre ellos: una pregunta, un objeto, un cambio de voz o de lugar.',
gancho:'El séptimo mito lo practican todos en la charla, celular en mano.',
check:{p:'¿Qué hace realmente la atención durante una charla?', r:'Fluctúa según el interés, la fatiga, el ambiente y la conducción del expositor. No tiene un límite fijo universal.'}},
{t:'Mito: "Soy bueno en multitarea"', h:`
<p class="myth">❌ "Puedo atender la charla y responder WhatsApp a la vez."</p>
<p><b>Lo que dice la evidencia:</b> para tareas que exigen atención, el cerebro <b>alterna</b> rápido entre una y otra. Cada cambio cuesta tiempo y produce errores. Quien revisa el celular en la charla se pierde partes que cree haber escuchado.</p>`,
dato:'Un estudio de Stanford (Ophir, Nass y Wagner, 2009) comparó a personas que hacían mucha multitarea con medios digitales contra las que hacían poca. Los "multitarea intensos" rindieron peor filtrando distracciones y cambiando de tarea, justo lo que creían hacer mejor.',
tip:'Pide los celulares en modo silencio y boca abajo al inicio, explicando el porqué en una frase. Funciona mejor que prohibirlos sin razón.',
gancho:'Y el último mito es el más peligroso de todos, porque se disfraza de cumplimiento.',
check:{p:'¿Qué hace el cerebro cuando "hace multitarea" con dos tareas que exigen atención?', r:'Alterna rápidamente entre ellas, con costo de tiempo y más errores.'}},
{t:'Mito: "Si firmó la lista, ya está capacitado"', h:`
<p class="myth">❌ "Tengo 25 firmas, la capacitación se cumplió."</p>
<p><b>Lo que dice la evidencia:</b> la firma prueba <b>asistencia</b>. No prueba atención, comprensión, recuerdo ni cambio de conducta. Rosa tenía veintiocho firmas y un Teodoro que hablaba de cascos.</p>
<div class="callout amber"><b>Haz esto:</b> agrega al menos una verificación real: 3 preguntas orales, una demostración inversa o un quiz corto. En el módulo 7 verás cómo medir con el modelo de Kirkpatrick.</div>`,
dato:'Renzo, el consultor, terminó su taller pidiendo que todos firmaran la lista y llenaran una encuesta de satisfacción. Puntaje promedio: 4.8 de 5. Una semana después, Rosa preguntó a cinco asistentes qué recordaban. Cuatro recordaron la pirámide del 10% al 90%. El único dato que recordaron era falso. La satisfacción no mide el aprendizaje.',
tip:'Agrega a tu registro de capacitación una columna simple: "verificación" (qué hiciste para comprobar que entendieron). Con el tiempo, ese dato vale más que las firmas.',
gancho:'Después del taller, Rosa cambió de lugar: dejó de mirar la charla desde el frente y se sentó, por primera vez en años, en la última fila.',
check:{p:'¿Qué prueba una lista de asistencia firmada?', r:'Solo asistencia. No prueba comprensión, recuerdo ni cambio de conducta.'}}
],

/* ================= MÓDULO 5 ================= */
{
id:'m5', icono:'👂', titulo:'El cerebro del que escucha', sub:'Qué pasa dentro de tu público mientras hablas', min:15,
relato:{t:'Capítulo 5 · La última fila', h:`
<p class="drop">El lunes, Rosa le pidió a su colega Iván que diera la charla de las seis y media. Ella se sentó en la última banca, junto a los tanques de combustible, con un cuaderno escondido dentro del casco.</p>
<p>Desde el frente, una charla parece un acto de comunicación. Desde la última fila, parece una sala de espera.</p>
<p>Anotó todo. Minuto 1: Iván dice «buenos días, hoy vamos a hablar de...». Tres personas bostezan en simultáneo, como si se hubieran puesto de acuerdo. Minuto 2: pasa la chata con el motor a fondo; durante cuarenta segundos Iván mueve la boca y no se oye nada. Iván sigue hablando igual. Minuto 3: Wilder mira el celular. Minuto 4: Iván dice «EPP», «ATS», «PETAR» y «IPERC» en una misma frase. El nuevo, un muchacho de Nauta en su segundo día, frunce el ceño como quien intenta leer en chino.</p>
<p>Minuto 6: Iván cuenta, casi de pasada, que una vez vio a un ayudante resbalar en la rampa con lluvia. Por primera vez en seis minutos, todas las cabezas giran hacia él al mismo tiempo.</p>
<p>Duró diez segundos. Luego Iván volvió a leer la lámina.</p>
<p>Rosa subrayó dos veces esa línea del cuaderno. Algo había pasado en el minuto 6 dentro de veinte cerebros a la vez. Quería saber qué.</p>`},
secciones:[
{t:'La atención sube y baja', h:`
<p>Tu público recuerda mejor <b>lo primero</b> (efecto de primacía) y <b>lo último</b> (efecto de recencia). En el medio, la atención se desgasta.</p>
<div data-widget="atencion"></div>
<div class="callout amber"><b>Consecuencias:</b> no desperdicies el inicio con trámites ("firmen la lista", "hoy les voy a hablar de..."). Pon el mensaje clave al principio y repítelo al final.</div>`,
dato:'En 1999, Simons y Chabris pidieron a voluntarios contar los pases de un equipo de básquet en un video. A mitad del video, una persona disfrazada de gorila cruza la cancha, se golpea el pecho y se va. Cerca de la mitad no vio al gorila. En 2013, Trafton Drew repitió la idea con radiólogos expertos: insertó un gorila diminuto en una tomografía de pulmón. El 83% no lo vio, aunque sus ojos pasaron por encima.',
tip:'Si tu público está concentrado en otra cosa (el celular, el motor, el calor), no verá tu "gorila". Primero captura su atención con algo directo; después da el mensaje.',
gancho:'Lo que ocurre en el medio de la charla depende de cuánto peso le pones encima a una mesa que ya conoces.',
check:{p:'¿Qué partes de una charla se recuerdan mejor y cómo se llaman esos efectos?', r:'El inicio (primacía) y el final (recencia). Ahí debe ir el mensaje clave.'}},
{t:'Carga cognitiva: no satures la mesa', h:`
<p>La memoria de trabajo de tu público es limitada. Todo compite por ese espacio. La teoría de carga cognitiva (John Sweller) distingue tres tipos:</p>
<ul>
<li><b>Intrínseca:</b> la dificultad propia del tema. No la puedes eliminar, pero puedes dosificarla.</li>
<li><b>Extraña:</b> lo que estorba: ruido, siglas sin explicar, láminas cargadas, desorden. <b>Elimínala.</b></li>
<li><b>Útil:</b> el esfuerzo de entender y conectar. Esa es la que quieres.</li>
</ul>
<p>En el minuto 4, el muchacho de Nauta gastaba toda su mesa en descifrar siglas. No le quedaba espacio para el mensaje.</p>
<div class="callout cyan"><b>Pregunta de control:</b> "¿Esto ayuda a que entiendan el mensaje, o solo ocupa espacio?"</div>`,
dato:'Las pupilas se dilatan cuando la mente trabaja más. En los años 60, Daniel Kahneman (luego premio Nobel de Economía) midió que la pupila se agranda a medida que una persona retiene más dígitos en la memoria y se contrae cuando los suelta. Literalmente puedes ver el esfuerzo mental en los ojos de alguien.',
tip:'Revisa tu guion y marca cada sigla. Por cada una, decide: o la explicas la primera vez, o la eliminas.',
gancho:'Ahora, el minuto 6. Lo que pasó cuando Iván contó lo del ayudante en la rampa tiene nombre y apellido.',
check:{p:'¿Qué tipo de carga cognitiva debes eliminar en una charla?', r:'La carga extraña: ruido, jerga, láminas sobrecargadas, desorden.'}},
{t:'Historias: los cerebros se sincronizan', h:`
<p>Cuando alguien cuenta una historia y otro la entiende, la actividad cerebral del que escucha <b>se acopla</b> con la del que habla. Cuanto mayor el acople, mejor la comprensión (Stephens, Silbert y Hasson, 2010).</p>
<p>Eso pasó en el minuto 6: veinte cerebros se sincronizaron con el de Iván durante diez segundos.</p>
<div class="callout amber"><b>Estructura de una historia de seguridad:</b><br>1. Persona y lugar concretos. 2. Una situación normal. 3. El giro (qué salió mal). 4. La consecuencia. 5. La lección en una frase.</div>
<p class="muted small">Sobre las "neuronas espejo": la idea se popularizó mucho, pero su papel en la comprensión humana todavía se debate. No hace falta para explicar por qué funcionan las historias.</p>`,
dato:'En el experimento de Hasson, una persona contaba una historia en inglés. Los oyentes que la entendían mostraban acople cerebral con ella. Como control, también hicieron escuchar una historia en ruso a quienes no hablaban ruso: el sonido llegaba igual a sus oídos, pero no hubo acople. La sincronía requiere comprensión, no solo sonido.',
tip:'Lleva siempre una historia de 30 segundos en el bolsillo para cada tema crítico. Si la charla se cae, cuéntala: es tu botón de reinicio.',
gancho:'Hay una forma de lograr esa sincronía antes de contar nada. Solo necesitas abrir un hueco.',
check:{p:'¿Cuáles son las 5 partes de una historia de seguridad efectiva?', r:'Persona y lugar concretos, situación normal, giro, consecuencia y lección en una frase.'}},
{t:'Curiosidad: abre un hueco', h:`
<p>La curiosidad aparece cuando el cerebro detecta un <b>hueco</b> entre lo que sabe y lo que quiere saber (George Loewenstein, 1994). Ese hueco activa el sistema de dopamina, y lo que aprendes en ese estado se recuerda mejor.</p>
<div class="callout cyan"><b>Cómo abrir el hueco:</b>
<ul><li>Empieza con una pregunta real: "¿Cuánto pesa la carga que levantamos ayer?"</li>
<li>Muestra algo inesperado: un grillete deformado.</li>
<li>Plantea un dilema: "¿Qué harías si...?"</li></ul>
Y después <b>cierra el hueco</b> con tu mensaje.</div>`,
dato:'Gruber, Gelman y Ranganath (2014) hicieron preguntas de trivia y pidieron a los voluntarios calificar cuánta curiosidad les daba cada una. Mientras esperaban la respuesta, les mostraban caras de personas que no tenían nada que ver. Al día siguiente, recordaban mejor las caras que vieron durante las preguntas que les daban más curiosidad. La curiosidad abre una ventana de aprendizaje para todo lo que pasa cerca.',
tip:'Este material usa la técnica que estás leyendo: cada sección termina con un gancho hacia la siguiente. Copia el truco: termina tu charla de hoy anunciando qué contarás mañana.',
gancho:'El miedo también abre huecos. Pero es una herramienta con filo por los dos lados.',
check:{p:'¿Qué produce la curiosidad y cómo la aprovechas al iniciar una charla?', r:'Un hueco entre lo que se sabe y lo que se quiere saber; abre la charla con una pregunta o algo inesperado y luego ciérralo con el mensaje.'}},
{t:'El miedo: úsalo con cuidado', h:`
<p>Los mensajes que asustan funcionan <b>solo si</b> vienen con una solución clara y creíble. La investigación sobre apelaciones al miedo (modelo de Kim Witte y metaanálisis de Tannenbaum y colegas, 2015) coincide:</p>
<ul>
<li><b>Amenaza + qué hacer + "tú puedes hacerlo"</b> → la persona actúa.</li>
<li><b>Amenaza sin salida clara</b> → la persona se defiende: niega, minimiza ("a mí no me va a pasar") o evita pensar en el tema.</li>
</ul>
<div class="callout amber"><b>⛑️ En campo:</b> una foto impactante sin una conducta concreta para evitarlo genera rechazo. Si muestras la consecuencia, dedica más tiempo a la acción preventiva que al susto.</div>`,
dato:'La mayoría de personas cree que tiene menos probabilidad que el promedio de sufrir un accidente, enfermarse o divorciarse. Matemáticamente, no todos pueden estar por debajo del promedio. Neil Weinstein lo documentó en 1980 y lo llamó "optimismo irreal". Por eso el "a mí no me va a pasar" es tan común en campo: el cerebro viene de fábrica con ese sesgo.',
tip:'Contra el optimismo irreal, usa casos cercanos: "esto pasó en un muelle igual a este, a un rigger con tu misma experiencia". La cercanía rompe el "a mí no".',
gancho:'Y luego está el problema que tenía Iván. Un problema que, cuanto más sabes, peor se pone.',
check:{p:'¿Qué necesita un mensaje que genera miedo para producir conducta segura?', r:'Una acción clara y la sensación de que la persona es capaz de hacerla (eficacia). Sin eso, genera negación o evitación.'}},
{t:'La maldición del conocimiento', h:`
<p>Cuando dominas un tema, <b>olvidas lo que es no saberlo</b>. Usas siglas, saltas pasos "obvios" y hablas rápido. Para ti es claro; para el nuevo es ruido.</p>
<div class="callout cyan"><b>Antídotos:</b>
<ul><li>Explica tu charla a alguien que no es del área antes de darla.</li>
<li>Define cada sigla la primera vez (ATS, PETAR, EPP).</li>
<li>Pregunta "¿qué parte no quedó clara?" en vez de "¿se entendió?".</li></ul></div>`,
dato:'En 1990, Elizabeth Newton pidió a unos voluntarios que "tamborilearan" con los dedos canciones famosas, como el "Feliz cumpleaños", para que otros las adivinaran. Los que tamborileaban calcularon que la mitad de los oyentes acertaría. Acertaron 3 de 120. El que tamborilea escucha la melodía en su cabeza; el que oye solo escucha golpes en una mesa. Así suena tu charla llena de siglas para el nuevo.',
tip:'Haz la prueba del nuevo: antes de una charla, pídele a alguien con menos de un mes en el proyecto que te diga qué entendió de tu mensaje central.',
gancho:'Y aunque domines todo lo anterior, falta el enemigo más concreto: el lugar donde das la charla.',
check:{p:'¿Qué es la maldición del conocimiento?', r:'La dificultad del experto para imaginar lo que es no saber, lo que lo lleva a usar jerga y saltarse pasos.'}},
{t:'El contexto de campo', h:`
<p>El cerebro del que escucha también sufre el ambiente:</p>
<ul>
<li><b>Ruido</b> (motores, generadores, helicóptero): entender exige más esfuerzo y deja menos memoria de trabajo para el contenido.</li>
<li><b>Calor y fatiga:</b> bajan la atención sostenida.</li>
<li><b>Protector auditivo puesto:</b> la voz llega atenuada.</li>
<li><b>Sol de frente:</b> nadie mira tus láminas ni tu cara.</li>
</ul>
<div class="callout amber"><b>Ajustes:</b> elige un lugar con sombra y lejos del ruido; ponte tú de frente al sol, no ellos; habla más lento; apóyate en objetos y gestos; repite la idea clave.</div>`,
dato:'En una fiesta ruidosa no entiendes la conversación de al lado, pero si alguien dice tu nombre, giras la cabeza. Colin Cherry describió en 1953 el "efecto cóctel" y Neville Moray mostró en 1959 que el propio nombre atraviesa el filtro de la atención incluso en un canal que la persona ignoraba. Tu cerebro vigila tu nombre aunque no estés escuchando.',
tip:'Usa nombres en la charla: "Wilder, imagina que tú estás en la rampa...". El nombre propio atraviesa el ruido y despierta al resto del grupo de paso.',
gancho:'Rosa cerró el cuaderno con doce páginas de notas y una decisión: su segunda charla iba a ser distinta. La preparó durante cuatro noches. La primera noche, empezó por el final.',
check:{p:'Menciona dos ajustes para dar una charla en el muelle con ruido de motores.', r:'Buscar un lugar más alejado del ruido, hablar más lento, usar objetos y gestos, pausar cuando pasa el ruido, usar nombres y repetir la idea clave.'}}
],
claves:['Primacía y recencia: lo clave al inicio y al final.','Elimina la carga extraña (ruido, jerga, láminas llenas).','Las historias sincronizan cerebros y se recuerdan.','La curiosidad abre un hueco; luego ciérralo.','Miedo sin solución clara produce rechazo; el optimismo irreal es de fábrica.','Cuidado con la maldición del conocimiento.','Usa nombres propios: atraviesan el ruido.'],
