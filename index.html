{t:'mc',d:true,p:'Una lámina con 12 líneas de texto, siglas sin explicar y ruido de fondo aumentan la carga:',o:['Intrínseca','Útil','Extraña','Emocional'],c:2,e:'Todo eso estorba sin ayudar a entender: es carga extraña.'},
{t:'vf',p:'Muestras fotos impactantes de un accidente sin explicar qué conducta lo previene. Esto garantiza que el personal trabaje más seguro.',c:false,e:'Miedo sin solución clara suele generar negación o evitación.'},
{t:'mc',p:'¿Qué demostró el experimento del gorila invisible?',o:['Que la gente ve todo lo que tiene delante','Que cuando la atención está ocupada en una tarea, podemos no ver algo evidente','Que los gorilas distraen','Que solo los expertos ven bien'],c:1,e:'Ceguera por falta de atención: incluso el 83% de radiólogos no vio el gorila en la tomografía.'},
{t:'mc',p:'Un experto explica usando siglas y saltando pasos "obvios". Es un caso de:',o:['Efecto de primacía','Maldición del conocimiento','Codificación dual','Chunking'],c:1,e:'El experto olvida lo que es no saber (como los que tamborileaban canciones).'},
{t:'orden',p:'Ordena la estructura de una historia de seguridad:',items:['Persona y lugar concretos','Situación normal','El giro','La consecuencia','La lección en una frase'],e:'Contexto concreto, tensión, consecuencia y una lección clara.'},
{t:'mc',p:'Estás en el muelle y pasa una embarcación con motor ruidoso. ¿Qué haces?',o:['Hablas más fuerte sin parar','Haces una pausa, esperas y retomas repitiendo la idea clave','Terminas la charla','Pides que lean el folleto'],c:1,e:'El ruido roba memoria de trabajo; pausa y repite.'},
{t:'mc',p:'¿Por qué usar el nombre de un participante ayuda en un ambiente ruidoso?',o:['Porque lo avergüenza','Porque el propio nombre atraviesa el filtro de la atención (efecto cóctel)','Porque es obligatorio','No ayuda'],c:1,e:'El cerebro vigila el propio nombre aun cuando no presta atención.'},
{t:'mc',p:'"A mí no me va a pasar" es una expresión del sesgo:',o:['De optimismo irreal','De primacía','De superioridad de la imagen','De producción'],c:0,e:'La mayoría se cree por debajo del promedio de riesgo (Weinstein, 1980).'}
],

{f:'Primacía y recencia',b:'Se recuerda mejor lo primero y lo último. El mensaje clave va al inicio y al final.'},

/* ================= MÓDULO 6 ================= */
{
id:'m6', icono:'🎤', titulo:'Cómo comunicar para que se recuerde', sub:'Estructura, lenguaje, voz, apoyos, interacción y técnicas de novelista', min:18,
relato:{t:'Capítulo 6 · Cuatro noches en el contenedor', h:`
<p class="drop">La primera noche, Rosa escribió en la parte de arriba de una hoja en blanco una sola pregunta y se quedó mirándola hasta que el generador se apagó a las once: ¿qué quiero que hagan distinto mañana?</p>
<p>No «hablar de izaje». No «concientizar». Algo que se pudiera ver con los ojos. A las once y diez, con la linterna del celular, escribió: <i>que nadie se pare debajo de una carga suspendida</i>. Nueve palabras. Las contó dos veces.</p>
<p>La segunda noche armó la estructura y tachó diecisiete láminas de diecinueve. La tercera noche ensayó en voz alta frente al espejo del contenedor, y descubrió con horror que decía «este» cada cuatro palabras y que, cuando se ponía nerviosa, hablaba como locutora de radio de feria.</p>
<p>La cuarta noche no pudo dormir. Le sudaban las manos. Pensó en llamar a Iván y pedirle que la reemplazara. Entonces se acordó de algo que había leído sobre los nervios, una idea tan simple que parecía una tomadura de pelo, y la probó.</p>
<p>Funcionó lo suficiente como para dormir cuatro horas.</p>
<p>Antes de apagar la linterna, agregó una última línea al guion, copiada de una técnica que usan los novelistas para que no sueltes el libro. Si salía bien, Teodoro iba a recordar esa charla tanto como el grillete de 2009.</p>`},
secciones:[
{t:'Empieza por el final', h:`
<p>Antes de preparar cualquier charla, responde una pregunta:</p>
<div class="bigq">"¿Qué quiero que hagan <u>distinto</u> mañana?"</div>
<p>La respuesta debe ser <b>una conducta observable</b>, no un tema. "Hablar de izaje" es un tema. "Que nadie se pare bajo la carga suspendida" es una conducta.</p>
<div class="callout amber"><b>Prueba del ascensor:</b> escribe tu mensaje central en una frase de menos de 15 palabras. Si no puedes, todavía no sabes qué quieres decir.</div>`,
dato:'En 1863, en Gettysburg, el orador principal del acto fue Edward Everett, famoso por su elocuencia. Habló cerca de dos horas. Después, Abraham Lincoln habló unos dos minutos: alrededor de 270 palabras. El discurso de Lincoln se estudia hasta hoy en los colegios; el de Everett casi nadie lo recuerda. Al día siguiente, el propio Everett le escribió a Lincoln diciéndole que ojalá él se hubiera acercado tanto a la idea central en dos horas como Lincoln en dos minutos.',
tip:'Escribe tu mensaje central en un papelito y guárdalo en el bolsillo de la camisa. Si te pierdes durante la charla, vuelve a esa frase.',
gancho:'Con el mensaje claro, falta el esqueleto. Y el cerebro tiene uno favorito.',
check:{p:'¿Cuál es la diferencia entre un tema y un mensaje central?', r:'El tema es de qué hablas ("izaje"); el mensaje central es la conducta concreta que quieres lograr ("nadie bajo la carga suspendida").'}},
{t:'Una estructura que el cerebro sigue', h:`
<ol class="steps">
<li><b>Gancho</b>: pregunta, dato local o algo inesperado. Abre el hueco de curiosidad.</li>
<li><b>Mensaje central</b>: la conducta, en una frase.</li>
<li><b>Máximo 3 puntos</b>: por qué importa, cómo se hace, qué pasa si no.</li>
<li><b>Prueba</b>: una historia, un objeto o una demostración.</li>
<li><b>Verificación</b>: que alguien lo explique o lo muestre.</li>
<li><b>Acción y cierre</b>: qué harán hoy, y repites el mensaje central.</li>
</ol>
<div class="callout cyan">La regla de 3 respeta la memoria de trabajo: tres ideas se recuerdan; siete se mezclan.</div>`,
dato:'Daniel Kahneman y Donald Redelmeier (1996) estudiaron a pacientes durante un examen médico incómodo. El recuerdo que tenían después dependía casi solo de dos momentos: el peor y el final. La duración total casi no importaba. Lo llamaron "regla del pico y el final". Tu público recordará tu charla por su momento más intenso y por cómo terminó.',
tip:'Diseña a propósito el "pico" de tu charla (la historia, el objeto, la demostración) y cuida el cierre como si fuera lo único que van a recordar. Probablemente lo sea.',
gancho:'El esqueleto ya está. Ahora, las palabras con que lo vistes.',
check:{p:'¿Cuáles son las 6 partes de la estructura recomendada?', r:'Gancho, mensaje central, máximo 3 puntos, prueba, verificación, acción y cierre.'}},
{t:'Lenguaje que se entiende', h:`
<ul>
<li><b>Concreto:</b> "el grillete de 3/4 del muelle 1" se entiende mejor que "los accesorios de izaje".</li>
<li><b>Verbos de acción:</b> "revisa", "aléjate", "avisa".</li>
<li><b>Cifras con contexto:</b> "4 toneladas, el peso de dos camionetas" se entiende mejor que "4000 kg".</li>
<li><b>Analogías</b> con lo cotidiano.</li>
<li><b>Frases cortas.</b> Una idea por frase.</li>
<li><b>Habla a la persona:</b> "tú" y "nosotros", no "el personal deberá".</li>
</ul>
<div class="callout amber"><b>Prueba rápida:</b> lee tu guion en voz alta. Donde tengas que tomar aire a mitad de frase, corta.</div>`,
dato:'El cerebro procesa una palabra concreta ("grillete", "río", "machete") más rápido y la recuerda mejor que una abstracta ("seguridad", "riesgo", "cumplimiento"). Los psicólogos lo llaman "efecto de concreción". Una palabra concreta activa imagen y significado a la vez: codificación dual gratis.',
tip:'Busca en tu guion las palabras "seguridad", "riesgo" y "concientizar". Reemplaza cada una por algo que se pueda tocar, ver o hacer.',
gancho:'Las palabras salen por un instrumento que casi nadie afina: tu voz. Y por otro que casi nadie controla: tus manos.',
check:{p:'Reescribe "4000 kg" para que se entienda mejor.', r:'"4 toneladas, lo que pesan dos camionetas" (cifra con contexto y comparación cotidiana).'}},
{t:'Tu voz y tu cuerpo', h:`
<ul>
<li><b>Volumen:</b> que te escuche bien el de la última fila, sin gritar.</li>
<li><b>Ritmo:</b> unas 120 a 150 palabras por minuto en conversación. Con ruido o público nuevo, más lento.</li>
<li><b>Pausas:</b> 2 o 3 segundos después de una idea importante. La pausa da tiempo a codificar y llama la atención.</li>
<li><b>Mirada:</b> recorre el grupo por sectores; sostén la mirada 2 o 3 segundos por persona.</li>
<li><b>Postura:</b> pies firmes, manos visibles, sin cruzar brazos. Muévete con intención, no por nervios.</li>
<li><b>Coherencia:</b> si dices "esto es grave" sonriendo y con prisa, creerán a tu cara.</li>
</ul>`,
dato:'Los gestos ayudan al que habla, no solo al que escucha. Susan Goldin-Meadow encontró que las personas ciegas de nacimiento gesticulan al hablar, incluso cuando conversan con otra persona ciega. Y cuando a alguien se le impide gesticular, encuentra las palabras con más dificultad. Mover las manos ayuda a pensar.',
tip:'Graba con tu celular 1 minuto de tu charla y escúchalo sin video. Cuenta tus muletillas ("este", "o sea", "¿no?"). Solo con notarlas, empiezan a bajar.',
gancho:'Y si usas láminas, hay cinco reglas que separan una lámina que ayuda de una que estorba.',
check:{p:'¿Para qué sirve una pausa de 2 o 3 segundos después de una idea clave?', r:'Da tiempo al cerebro del oyente para procesar y codificar, y marca la idea como importante.'}},
{t:'Apoyos visuales que ayudan', h:`
<p>Richard Mayer estudió durante décadas cómo combinar palabra e imagen. Sus principios más útiles:</p>
<ul>
<li><b>Coherencia:</b> quita todo lo decorativo que no aporta.</li>
<li><b>Redundancia:</b> no leas el texto de la lámina. Si hablas y el texto dice lo mismo, compiten.</li>
<li><b>Señalización:</b> señala o resalta lo que importa.</li>
<li><b>Contigüidad:</b> la etiqueta va pegada a la imagen, no en otro lado.</li>
<li><b>Segmentación:</b> divide en pasos cortos.</li>
</ul>
<div class="callout cyan"><b>Jerarquía práctica en campo:</b> objeto real &gt; demostración &gt; foto &gt; dibujo &gt; texto.</div>`,
dato:'Harp y Mayer (1998) agregaron a un texto científico datos curiosos e imágenes llamativas que no tenían relación con la explicación central. Los lectores dijeron que el texto era más interesante, pero aprendieron menos. Lo llamaron "detalles seductores". Por eso cada dato insólito de este material está conectado con la idea que enseña: si no se conecta, distrae.',
tip:'Antes de usar una imagen o un video "impactante", pregúntate: ¿esto ilustra mi mensaje central o solo entretiene? Si solo entretiene, sácalo.',
gancho:'Las láminas informan. Lo que hace pensar es lo que viene ahora.',
check:{p:'¿Por qué no conviene leer el texto de la lámina en voz alta?', r:'Por el principio de redundancia: el texto escrito y la voz diciendo lo mismo compiten por la atención y sobrecargan.'}},
{t:'Interacción que hace pensar', h:`
<ul>
<li><b>Preguntas abiertas:</b> "¿Qué podría salir mal aquí?" en vez de "¿Está claro?".</li>
<li><b>Tiempo de espera:</b> después de preguntar, cuenta mentalmente hasta 5. El silencio incomoda, pero da tiempo para pensar.</li>
<li><b>Teach-back:</b> "Explícame con tus palabras qué harías si...". Si no puede explicarlo, el problema está en cómo lo enseñaste.</li>
<li><b>Demostración inversa:</b> que el participante haga la maniobra mientras tú observas.</li>
<li><b>Ronda de compromiso:</b> cada uno dice una cosa que hará hoy.</li>
</ul>`,
dato:'En los años 70, Mary Budd Rowe midió cuánto esperaban los profesores después de hacer una pregunta antes de responderla ellos mismos o pasar a otro alumno: en promedio, alrededor de un segundo. Cuando los entrenó para esperar 3 segundos o más, los alumnos daban respuestas más largas, más razonadas, y participaban los que antes no hablaban.',
tip:'Después de preguntar, mira tu reloj o cuenta con los dedos detrás de la espalda hasta cinco. Si nadie responde, reformula; no respondas tú.',
gancho:'Ahora, la técnica que Rosa agregó la última noche. La que usan los novelistas para que no sueltes el libro.',
check:{p:'¿Qué es el teach-back?', r:'Pedir al participante que explique con sus palabras lo aprendido, para verificar comprensión real.'}},
{t:'Lo que los novelistas saben (y tú puedes robar)', h:`
<p>Este material está escrito con técnicas de novela. No por adorno: cada una tiene una razón neurológica, y todas sirven en una charla de 5 minutos.</p>
<div class="tech"><h4>1. Anuncia el final (García Márquez)</h4>
<p>Gabriel García Márquez abre <i>Crónica de una muerte anunciada</i> diciendo que van a matar al protagonista. Sabes el final desde la primera línea y aun así no puedes dejar de leer: la curiosidad se muda del <b>qué</b> al <b>cómo</b>. Es el hueco de Loewenstein en estado puro.</p>
<p class="ej">En tu charla: "Hoy les voy a contar cómo un grillete de 3/4 terminó a quince metros del muelle, y por qué nadie salió herido por diez centímetros."</p></div>
<div class="tech"><h4>2. El detalle exacto (García Márquez)</h4>
<p>García Márquez cuenta lo increíble con precisión de notario: fechas, horas, cifras, olores. El detalle concreto hace creíble lo extraordinario, y el cerebro guarda mejor lo concreto que lo abstracto.</p>
<p class="ej">En vez de "hubo un incidente con una carga", di: "a las diez y doce, una tubería de seis metros giró sola y rozó el pasamanos".</p></div>
<div class="tech"><h4>3. La confesión (Jaime Bayly)</h4>
<p>Jaime Bayly escribe en primera persona y confiesa sus debilidades, sus vergüenzas y sus errores sin filtro y con humor. El lector siente que le cuentan un secreto y baja la guardia. Mostrar vulnerabilidad genera confianza.</p>
<p class="ej">En tu charla: "Yo también me paré debajo de una carga una vez. Tenía 24 años y me creía muy vivo. Les cuento qué pasó."</p></div>
<div class="tech"><h4>4. La ironía que desarma (Bayly)</h4>
<p>Bayly rompe la solemnidad con ironía. Una sonrisa baja las defensas del público y le da al cerebro una pequeña sorpresa (dopamina). Regla: ríete de la situación o de ti mismo, nunca de un trabajador.</p></div>
<div class="tech"><h4>5. Capítulos cortos con gancho final</h4>
<p>Los novelistas de folletín y las series terminan cada capítulo en suspenso. Aplicado a charlas, el gancho final crea una serie: "Mañana les cuento qué encontramos al revisar esa eslinga." Y una serie de charlas sobre el mismo tema es <b>repaso espaciado</b> disfrazado de entretenimiento.</p></div>
<div class="tech"><h4>6. El ritmo: frase larga, frase corta</h4>
<p>Una frase larga crea tensión, acumula imágenes y te arrastra. Una corta golpea. Así se marca lo importante sin subir la voz.</p></div>`,
dato:'García Márquez contó en entrevistas que buscaba la primera frase de una novela durante meses, porque sentía que esa frase definía el tono de todo el libro. Algunos de sus inicios están entre los más citados de la literatura en español. En una charla de 5 minutos, tu primera frase pesa igual: es tu efecto de primacía.',
tip:'Escribe tres versiones de tu primera frase: una pregunta, una confesión y un final anunciado. Léelas en voz alta y quédate con la que te dé más curiosidad a ti mismo.',
gancho:'Quedaba un último obstáculo entre Rosa y su segunda charla. El más humano de todos.',
check:{p:'¿Qué técnica de novelista aplicas si inicias diciendo "hoy les cuento cómo un grillete terminó a 15 metros del muelle"?', r:'Anunciar el final (prolepsis, como García Márquez): la curiosidad pasa del qué al cómo.'}},
{t:'Los nervios del comunicador', h:`
<p>Sentir nervios antes de hablar es normal: tu cuerpo libera adrenalina para prepararte. El problema aparece cuando lo interpretas como amenaza.</p>
<ul>
<li><b>Reencuadra:</b> di "estoy activado" en lugar de "tengo miedo". En un estudio de Alison Wood Brooks (2014), decirse "estoy emocionado" antes de hablar en público mejoró el desempeño frente a intentar calmarse. Esta fue la idea "tan simple que parecía una tomadura de pelo" que probó Rosa.</li>
<li><b>Respira con exhalación larga:</b> inhala 4 segundos, exhala 6 a 8. La exhalación lenta ayuda a bajar el ritmo cardiaco.</li>
<li><b>Memoriza los primeros 30 segundos.</b> El arranque es el momento de más nervios.</li>
<li><b>Ensaya en voz alta</b>, no solo en la cabeza.</li>
<li><b>Enfócate en ellos:</b> tu trabajo es que vuelvan sanos a casa. Esa intención baja la autoexigencia.</li>
</ul>`,
dato:'Tus nervios se notan mucho menos de lo que crees. Kenneth Savitsky y Thomas Gilovich (2003) lo llamaron "ilusión de transparencia": los oradores sobreestiman cuánto ve el público su ansiedad. Cuando les explicaron esto antes de hablar, se pusieron menos nerviosos y el público calificó mejor sus discursos. Y ojo con otro mito: la frase "la gente le teme más a hablar en público que a la muerte" sale de una encuesta de 1973, popularizada por un libro de 1977, que solo pedía marcar miedos de una lista. No medía la intensidad de nada.',
tip:'Antes de empezar, repítete en silencio dos frases: "estoy activado" y "se nota menos de lo que siento". Las dos tienen respaldo experimental.',
gancho:'A las seis y veintiocho de la mañana siguiente, Rosa caminó hacia el muelle con un grillete deformado en el bolsillo de la casaca. Pesaba como una piedra.',
check:{p:'Menciona dos técnicas para manejar los nervios antes de una charla.', r:'Reencuadrar la activación ("estoy activado"), recordar la ilusión de transparencia, respiración con exhalación larga, memorizar el inicio, ensayar en voz alta, enfocarse en el público.'}}
],

/* ================= MÓDULO 7 ================= */
{
id:'m7', icono:'⛑️', titulo:'Aplicado a charlas y capacitaciones SST', sub:'Charla de 5 minutos, inducción, capacitación técnica y medición', min:16,
relato:{t:'Capítulo 7 · El grillete en el bolsillo', h:`
<p class="drop">Rosa no dijo «buenos días». No pidió que firmaran. Sacó el grillete deformado del bolsillo, lo levantó a la altura de los ojos y esperó. Cuatro segundos. Cinco. El motor de la chata se calló justo en ese momento, como si estuviera en el guion.</p>
<p class="dlg">«Esto pesa un kilo doscientos. En 2009 pasó a un metro de la cabeza de alguien que está aquí. Teodoro, ¿lo cuentas tú o lo cuento yo?»</p>
<p>Teodoro lo contó. Mal, con desorden, con una ráfaga de viento que Rosa sospechaba inventada. Pero veinte cabezas giraron hacia él y no volvieron a moverse.</p>
<p>Rosa dijo su frase de nueve palabras. La dijo al principio, la repitió en el medio y la hizo repetir al final, en coro, entre risas. Le pidió al muchacho de Nauta que mostrara dónde se pararía cuando la grúa girara. Se equivocó; lo corrigió sin burla; lo volvió a intentar y acertó. Cinco minutos exactos.</p>
<p>No supo si había funcionado hasta tres semanas después.</p>
<p>Un jueves, a las diez de la mañana, una tubería subía hacia la chata. Wilder, apurado, dio un paso hacia la zona de la carga para acomodar la soga guía. Antes de que Rosa abriera la boca, Teodoro lo jaló del chaleco y le dijo, sin mirarlo, con los ojos en la carga, nueve palabras.</p>
<p>Rosa las contó. Eran las suyas.</p>
<p>Ese día entendió la diferencia entre dar una charla y lograr que algo se quede. Este último módulo es el manual de esa diferencia.</p>`},
secciones:[
{t:'La charla de 5 minutos, minuto a minuto', h:`
<div data-widget="charla5"></div>
<div class="callout amber"><b>Regla de oro:</b> una charla = una conducta. Si tienes tres temas, tienes tres charlas para tres días distintos (y de paso ganas repaso espaciado).</div>`,
dato:'Williamson y Feyer (2000) midieron el rendimiento de personas sin dormir. Tras 17 a 19 horas despiertas, su desempeño en pruebas de atención y reacción era comparable al de alguien con 0.05% de alcohol en sangre. Tras más horas, equivalente a 0.1%. Una charla al final de un turno nocturno se da, en términos cerebrales, ante un público que "tomó unas cervezas".',
tip:'Si te toca dar la charla al cambio de turno, dirígela al turno que entra (descansado), no al que sale. Y pide al que sale que cuente un hallazgo de su turno: así participan sin tener que retener nada nuevo.',
gancho:'La charla de 5 minutos es un sprint. La inducción del personal nuevo es otra carrera, con otra trampa.',
check:{p:'¿Qué haces en el último minuto de una charla de 5 minutos?', r:'Pides un compromiso concreto para hoy y repites el mensaje central.'}},
{t:'Inducción a personal nuevo', h:`
<p>El primer día, el cerebro del nuevo está saturado: lugar nuevo, caras nuevas, ruido, normas. Si le das 40 temas, retendrá muy pocos y al azar.</p>
<ul>
<li><b>Prioriza lo vital del día 1:</b> riesgos críticos de su puesto, qué hacer en emergencia, a quién preguntar, cómo detener un trabajo.</li>
<li><b>Espacia el resto</b> durante la primera semana.</li>
<li><b>Asigna un acompañante</b> con experiencia.</li>
<li><b>Verifica</b> con preguntas abiertas y recorrido por el área.</li>
</ul>
<div class="callout cyan">La Ley 29783 exige capacitar al trabajador al ingresar y de forma periódica. Cumplir el registro es obligatorio; lograr que aprenda es tu verdadero objetivo.</div>`,
dato:'Gabriel Radvansky (2011) descubrió algo que te ha pasado: entras a un cuarto a buscar algo y olvidas qué buscabas. En sus experimentos, cruzar una puerta hacía que las personas olvidaran más que si recorrían la misma distancia dentro del mismo cuarto. El cerebro trata la puerta como el fin de un "episodio" y archiva lo anterior. El primer día del nuevo está lleno de puertas: oficina, almacén, muelle, comedor.',
tip:'Haz la inducción de cada riesgo en el lugar donde existe, y repite lo crítico al cruzar a la siguiente área: "antes de entrar al muelle, ¿qué es lo único que no harás?".',
gancho:'Cuando lo que enseñas es una habilidad, hay un método que la industria usa desde la Segunda Guerra Mundial.',
check:{p:'¿Qué debe priorizar la inducción del primer día?', r:'Riesgos críticos del puesto, respuesta ante emergencias, a quién preguntar y cómo detener un trabajo inseguro. El resto se espacia en la semana.'}},
{t:'Capacitación técnica: el método TWI', h:`
<p>Para enseñar una habilidad (izaje, uso de arnés, extintor), usa el método de <b>Instrucción de Trabajo</b> (TWI):</p>
<ol class="steps">
<li><b>Preparar:</b> ubica al trabajador, explora qué sabe ya, despierta interés.</li>
<li><b>Presentar:</b> explica y muestra paso a paso, resaltando los puntos clave y el porqué.</li>
<li><b>Probar:</b> que lo haga él, primero guiado y luego solo, explicando cada paso. Corrige en el momento.</li>
<li><b>Seguimiento:</b> obsérvalo en el trabajo real los días siguientes.</li>
</ol>
<div class="callout amber">El lema de TWI: "Si el trabajador no ha aprendido, el instructor no ha enseñado." Revisa tu método antes que culparlo.</div>`,
dato:'TWI nació en Estados Unidos en 1940, cuando las fábricas de guerra tuvieron que entrenar a millones de trabajadores sin experiencia, muchos de ellos mujeres que nunca habían pisado una planta. Se capacitó a más de un millón y medio de supervisores con este método. Después de la guerra, EE. UU. lo dejó de lado; Japón lo adoptó, y Toyota lo integró en su sistema de producción.',
tip:'En el paso "Probar", pide que el trabajador diga en voz alta el porqué de cada punto clave mientras lo hace. Juntas recuperación, producción y memoria procedimental.',
gancho:'Las habilidades se enseñan practicando. Los incidentes se enseñan contando. Pero contarlos bien es un arte con trampas.',
check:{p:'¿Cuáles son los 4 pasos del método de instrucción de trabajo?', r:'Preparar, presentar, probar (que lo haga) y seguimiento.'}},
{t:'Lecciones aprendidas de incidentes', h:`
<p>Un incidente bien contado es la historia más poderosa que tienes. Mal contado, genera miedo, burla o defensas.</p>
<ul>
<li><b>Cuenta qué pasó</b> con hechos, sin nombres si no es necesario.</li>

/* ========== Persistencia: IndexedDB con patrón repositorio ========== */
const DB={db:null,ok:false,
  open(){return new Promise(res=>{try{const r=indexedDB.open('neurocomunica',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv',{keyPath:'k'});d.createObjectStore('intentos',{keyPath:'id',autoIncrement:true});d.createObjectStore('tarjetas',{keyPath:'id'});d.createObjectStore('charlas',{keyPath:'id',autoIncrement:true})};
    r.onsuccess=()=>{this.db=r.result;this.ok=true;res()};r.onerror=()=>res()}catch(e){res()}})}};
class Repo{
  constructor(store){this.s=store;this.mem=new Map();this.seq=1}
  _st(m){return DB.db.transaction(this.s,m).objectStore(this.s)}
  _p(q){return new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
  async all(){if(!DB.ok)return[...this.mem.values()];return this._p(this._st('readonly').getAll())}
  async get(k){if(!DB.ok)return this.mem.get(k);return this._p(this._st('readonly').get(k))}
  async put(v){if(!DB.ok){const key=v.k??v.id??(v.id=this.seq++);this.mem.set(key,v);return key}return this._p(this._st('readwrite').put(v))}
  async del(k){if(!DB.ok)return this.mem.delete(k);return this._p(this._st('readwrite').delete(k))}
  async clear(){if(!DB.ok)return this.mem.clear();return this._p(this._st('readwrite').clear())}
}
const R={kv:new Repo('kv'),intentos:new Repo('intentos'),tarjetas:new Repo('tarjetas'),charlas:new Repo('charlas')};

/* ========== Estado en memoria ========== */
const S={cfg:{nombre:'',vib:true,big:false,rate:1},prog:{},cards:{},intentos:[],charlas:[]};
async function load(){
  await DB.open();
  const cfg=await R.kv.get('cfg');if(cfg)Object.assign(S.cfg,cfg.v);
  const pr=await R.kv.get('prog');S.prog=pr?pr.v:{};
  (await R.tarjetas.all()).forEach(c=>S.cards[c.id]=c);
  S.intentos=(await R.intentos.all()).sort((a,b)=>a.fecha-b.fecha);
  S.charlas=(await R.charlas.all()).sort((a,b)=>a.fecha-b.fecha);
  MODULOS.forEach(m=>{if(!S.prog[m.id])S.prog[m.id]={leidas:[],best:null,n:0}});
  document.documentElement.classList.toggle('big',!!S.cfg.big);
}
const saveCfg=()=>R.kv.put({k:'cfg',v:S.cfg});
const saveProg=()=>R.kv.put({k:'prog',v:S.prog});

/* ========== Preparación de contenido ========== */
MODULOS.forEach((m,mi)=>{m.n=mi+1;m.quiz.forEach((q,i)=>q.id=m.id+'q'+(i+1));m.cartas.forEach((c,i)=>{c.id=m.id+'c'+i;c.mid=m.id})});
const ALLQ=MODULOS.flatMap(m=>m.quiz.map(q=>({...q,mid:m.id})));
const DIAGQ=ALLQ.filter(q=>q.d);
const pages=m=>m.secciones.length+2; // relato + secciones + cierre
const readFrac=m=>Math.min(1,(S.prog[m.id].leidas||[]).length/pages(m));
const modDone=m=>readFrac(m)>=1;
const modProg=m=>{const b=S.prog[m.id].best;return 0.6*readFrac(m)+0.4*((b??0)/100)};
const totalProg=()=>MODULOS.reduce((a,m)=>a+modProg(m),0)/MODULOS.length;

/* ========== Voz ========== */
function speak(el,btn){
  if(!('speechSynthesis' in window))return toast('Tu navegador no tiene lectura en voz alta');
  if(speechSynthesis.speaking){speechSynthesis.cancel();if(btn)btn.textContent='🔊 Escuchar';return}
  const u=new SpeechSynthesisUtterance(el.innerText.replace(/➜/g,''));
  const vs=speechSynthesis.getVoices();const v=vs.find(v=>/es[-_](PE|419|MX|US|CO)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang));
  if(v)u.voice=v;u.lang=v?v.lang:'es-PE';u.rate=S.cfg.rate||1;
  u.onend=()=>{if(btn)btn.textContent='🔊 Escuchar'};
  speechSynthesis.speak(u);if(btn)btn.textContent='⏹ Detener';
}

  view().innerHTML=`<div class="fade"><h2>📖 La novela del cerebro que aprende</h2><p class="muted small">Siete capítulos. Cada uno abre con la historia de Rosa, una supervisora cuya primera charla fracasa, y sigue con la ciencia que explica por qué. Lee en orden: cada capítulo termina con un gancho al siguiente.</p>
  ${MODULOS.map(m=>{const pr=S.prog[m.id],rf=readFrac(m);return `<button class="mod" onclick="go('leer/${m.id}/${firstUnread(m)}')"><div class="ic">${m.icono}</div><div class="grow"><div class="t">${m.n}. ${esc(m.titulo)}</div><div class="s">${esc(m.relato.t.split('·')[1]||'')} · ${m.min} min</div><div class="bar" style="margin-top:7px"><i style="width:${rf*100}%"></i></div><div class="row" style="gap:6px;margin-top:6px">${rf>=1?'<span class="tag ok">leído</span>':''}${pr.best!=null?`<span class="tag ${pr.best>=70?'ok':'am'}">quiz ${Math.round(pr.best)}%</span>`:''}</div></div></button>`}).join('')}</div>`;

/* ========== Vista: Lectura ========== */
function vLeer(mid,pg){
  const m=MODULOS.find(x=>x.id===mid);if(!m)return go('aprender');
  const N=pages(m);pg=Math.max(0,Math.min(N-1,pg));
  const pr=S.prog[m.id];if(!pr.leidas.includes(pg)){pr.leidas.push(pg);saveProg();if(modDone(m)){unlockCards();toast('Capítulo completo: tarjetas de repaso desbloqueadas')}}
  const dots=Array.from({length:N},(_,i)=>`<i class="${i===pg?'c':pr.leidas.includes(i)?'r':''}"></i>`).join('');
  let body='';
  if(pg===0){body=`<div class="chap">Capítulo ${m.n}</div><h2>${esc(m.relato.t.split('·')[1]?.trim()||m.titulo)}</h2><div class="relato">${m.relato.h}</div><div class="gancho">Ahora, la ciencia detrás de la historia.</div>`}
  else if(pg<=m.secciones.length){const s=m.secciones[pg-1];
    body=`<div class="chap">${m.icono} ${esc(m.titulo)} · ${pg}/${m.secciones.length}</div><h2>${esc(s.t)}</h2>${s.h}
    ${s.dato?`<div class="dato"><h5>🔎 Dato insólito</h5>${esc(s.dato)}</div>`:''}
    ${s.tip?`<div class="tip"><h5>💡 Tip</h5>${esc(s.tip)}</div>`:''}
    ${s.check?`<div class="check" id="chk"><div class="small cy">🧠 ¿Lo recuerdas? Respóndelo en tu mente antes de tocar.</div><div class="q">${esc(s.check.p)}</div><div class="ans">${esc(s.check.r)}</div><button class="btn speak" style="margin-top:8px" onclick="this.parentNode.classList.add('open');this.remove()">Ver respuesta</button></div>`:''}
    ${s.gancho?`<div class="gancho">${esc(s.gancho)}</div>`:''}`}
  else{body=`<div class="chap">Cierre del capítulo ${m.n}</div><h2>Ideas clave</h2><ul>${m.claves.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
    <div class="callout cyan">Ahora pon a prueba tu memoria. Recuperar lo leído es lo que lo fija (efecto de prueba).</div>
    <div class="row"><button class="btn pri grow" onclick="go('quiz/${m.id}')">📝 Quiz del capítulo</button><button class="btn sec grow" onclick="go('repasar/practica/${m.id}')">🗂️ Tarjetas</button></div>
    ${m.n<MODULOS.length?`<button class="btn full" style="margin-top:10px" onclick="go('leer/${MODULOS[m.n].id}/0')">Capítulo ${m.n+1}: ${esc(MODULOS[m.n].titulo)} →</button>`:''}`}
  view().innerHTML=`<div class="fade lesson"><div class="lesson-head"><button class="ib" onclick="go('aprender')">←</button><div class="grow small muted">${esc(m.titulo)}</div><button class="btn speak" id="spk">🔊 Escuchar</button></div><div class="dots">${dots}</div><div id="lbody">${body}</div>
  <div class="navrow"><button class="btn" ${pg===0?'disabled':''} onclick="go('leer/${m.id}/${pg-1}')">← Anterior</button>${pg<N-1?`<button class="btn pri" onclick="go('leer/${m.id}/${pg+1}')">Siguiente →</button>`:''}</div></div>`;
  $('#spk').onclick=e=>speak($('#lbody'),e.currentTarget);
  mountWidgets($('#lbody'));
}

/* ========== Motor de evaluación ========== */
let Q=null;
function startQuiz(tipo,mid){
  let pre,titulo;
  if(tipo==='modulo'){const m=MODULOS.find(x=>x.id===mid);if(!m)return go('evaluar');pre=shuffle(m.quiz.map(q=>({...q,mid:m.id})));titulo=`Quiz · Cap. ${m.n}: ${m.titulo}`}
  else if(tipo==='diag'){if(diagAtt()&&!confirm('Ya hiciste el diagnóstico. Si lo repites, para medir tu ganancia se seguirá usando el primero. ¿Repetir de todos modos?'))return go('evaluar');pre=shuffle(DIAGQ);titulo='Diagnóstico inicial'}
  else{if(!diagAtt()&&!confirm('Aún no haces el diagnóstico inicial, así que no podrás ver tu ganancia de aprendizaje. ¿Continuar?'))return go('evaluar');
    const extra=shuffle(ALLQ.filter(q=>!q.d)).slice(0,11);pre=shuffle([...DIAGQ,...extra]);titulo='Examen final'}
  Q={tipo,mid,titulo,qs:pre.map(prep),i:0,res:[],t0:now(),sel:[]};
  renderQ();
}
function prep(q){const o={...q};if(q.t==='mc')o.ord=shuffle(q.o.map((_,i)=>i));if(q.t==='orden')o.mix=shuffle(q.items.map((_,i)=>i));return o}
function renderQ(){
  const q=Q.qs[Q.i],n=Q.qs.length;Q.sel=[];
  let opts='';
  if(q.t==='mc')opts=q.ord.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join('');
  else if(q.t==='vf')opts=`<button class="opt" data-v="1">✅ Verdadero</button><button class="opt" data-v="0">❌ Falso</button>`;
  else opts=`<p class="small muted">Toca los elementos en el orden correcto.</p><div class="ordlist">${q.mix.map(i=>`<button class="opt" data-k="${i}"><span class="n"></span>${esc(q.items[i])}</button>`).join('')}</div><div class="row"><button class="btn grow" id="oR">Reiniciar</button><button class="btn pri grow" id="oC" disabled>Comprobar</button></div>`;
  view().innerHTML=`<div class="fade"><div class="qhead"><button class="ib" onclick="if(confirm('¿Salir? Se perderá este intento.'))go('evaluar')">✕</button><span class="small muted">${esc(Q.titulo)}</span><span class="mono am">${Q.i+1}/${n}</span></div>
  <div class="bar"><i style="width:${Q.i/n*100}%"></i></div>
  <div class="card" style="margin-top:12px"><div class="small cy">${q.t==='vf'?'Verdadero o falso':q.t==='orden'?'Ordenar':'Opción múltiple'}</div><div class="qp">${esc(q.p)}</div><div id="opts">${opts}</div><div id="fb"></div></div></div>`;
  if(q.t==='mc')$$('#opts .opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i===q.c,b));
  else if(q.t==='vf')$$('#opts .opt').forEach(b=>b.onclick=()=>answer((b.dataset.v==='1')===q.c,b));
  else{const bs=$$('.ordlist .opt');
    bs.forEach(b=>b.onclick=()=>{if(b.classList.contains('sel'))return;Q.sel.push(+b.dataset.k);b.classList.add('sel');$('.n',b).textContent=Q.sel.length;$('#oC').disabled=Q.sel.length<q.items.length});
    $('#oR').onclick=()=>{Q.sel=[];bs.forEach(b=>{b.classList.remove('sel');$('.n',b).textContent=''});$('#oC').disabled=true};
    $('#oC').onclick=()=>{const ok=Q.sel.every((k,i)=>k===i);bs.forEach(b=>{const k=+b.dataset.k;b.classList.add(Q.sel.indexOf(k)===k?'ok':'bad')});$('#oR').remove();$('#oC').remove();answer(ok,null,`Orden correcto: ${q.items.map((t,i)=>(i+1)+'. '+t).join(' → ')}`)}}
}
function answer(ok,btn,extra){
  const q=Q.qs[Q.i];
  $$('#opts .opt').forEach(b=>{b.disabled=true;if(q.t==='mc'&&+b.dataset.i===q.c)b.classList.add('ok');if(q.t==='vf'&&(b.dataset.v==='1')===q.c)b.classList.add('ok')});
  if(btn&&!ok)btn.classList.add('bad');
  vib(ok?15:[30,40,30]);
  Q.res.push({id:q.id,ok});
  const last=Q.i===Q.qs.length-1;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'¡Correcto!':'No exactamente.'}</b> ${esc(q.e)}${extra?`<div class="small" style="margin-top:6px">${esc(extra)}</div>`:''}</div><button class="btn pri full" id="nx">${last?'Ver resultado':'Siguiente →'}</button>`;
  $('#nx').onclick=()=>{if(last)finishQ();else{Q.i++;renderQ()}};
  $('#nx').scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function finishQ(){
  const okN=Q.res.filter(r=>r.ok).length,n=Q.res.length,pct=okN/n*100;
  const att={tipo:Q.tipo,mid:Q.mid||null,fecha:now(),pct,ok:okN,n,seg:Math.round((now()-Q.t0)/1000),det:Q.res};
  att.id=await R.intentos.put(att);S.intentos.push(att);
  if(Q.tipo==='modulo'){const p=S.prog[Q.mid];p.n=(p.n||0)+1;p.best=Math.max(p.best??0,pct);saveProg();unlockCards()}
  const qmap=Object.fromEntries(Q.qs.map(q=>[q.id,q]));
  const g=Q.tipo==='final'?ganancia():null;
  const msg=pct>=90?'Excelente. Esto ya está en tu memoria de largo plazo… si lo repasas.':pct>=70?'Aprobado. Repasa los errores: con la explicación correcta se graban mejor (efecto de hipercorrección).':pct>=50?'Vas en camino. Vuelve a leer las secciones de tus errores y repite en unos días.':'Normal si es tu primer intento. Cada error con explicación te deja más que una respuesta adivinada.';
  view().innerHTML=`<div class="fade"><div class="card" style="text-align:center"><div class="small muted">${esc(Q.titulo)}</div><div class="big-score">${Math.round(pct)}%</div>
  <div class="mono">Nota vigesimal: <b class="${pct>=70?'okc':'am'}">${nota20(pct).toFixed(1)}</b>/20 · ${okN}/${n} correctas · ${Math.floor(att.seg/60)}:${String(att.seg%60).padStart(2,'0')} min</div>
  <p class="small" style="margin:10px 0 0">${msg}</p></div>
  ${g?ganCard(g):''}
  ${Q.tipo==='diag'?`<div class="callout cyan">Guardado como tu línea base. Al final rendirás el examen final, que incluye estas mismas ${DIAGQ.length} preguntas, y verás cuánto aprendiste.</div>`:''}
  <div class="card"><h3>Revisión</h3>${Q.res.map((r,i)=>{const q=qmap[r.id];return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div>${r.ok?'✅':'❌'} <span class="small">${esc(q.p)}</span></div>${r.ok?'':`<div class="small cy" style="margin-top:4px">${esc(q.t==='mc'?'Respuesta: '+q.o[q.c]:q.t==='vf'?'Respuesta: '+(q.c?'Verdadero':'Falso'):'Orden: '+q.items.join(' → '))}. ${esc(q.e)}</div>`}</div>`}).join('')}</div>
  <div class="row">${Q.tipo==='modulo'?`<button class="btn grow" onclick="go('quiz/${Q.mid}')">Repetir</button>`:''}<button class="btn pri grow" onclick="go('evaluar')">Volver a Evaluar</button></div></div>`;
}
function ganancia(){
  const d=diagAtt(),f=finalAtts().slice(-1)[0];if(!d||!f)return null;
  const ids=new Set(DIAGQ.map(q=>q.id));
  const sc=a=>{const r=a.det.filter(x=>ids.has(x.id));return r.length?r.filter(x=>x.ok).length/r.length*100:0};
  const pre=sc(d),post=sc(f),g=pre>=100?0:(post-pre)/(100-pre);
  return {pre,post,g};
}
function ganCard(g){
  const lv=g.g>=.7?['alta','okc']:g.g>=.3?['media','am']:g.g>0?['baja','badc']:['sin ganancia','badc'];
  return `<div class="card"><h3>📈 Ganancia de aprendizaje</h3><div class="grid2"><div class="stat"><b>${Math.round(g.pre)}%</b><span>Antes (diagnóstico)</span></div><div class="stat"><b style="color:var(--cy)">${Math.round(g.post)}%</b><span>Después (mismas preguntas)</span></div></div>
  <p style="margin:10px 0 0">Ganancia normalizada: <b class="mono ${lv[1]}">${g.g.toFixed(2)}</b> (<b>${lv[0]}</b>)</p><p class="small muted" style="margin:4px 0 0">Fórmula de Hake: (después − antes) / (100 − antes). Mide qué parte de lo que te faltaba saber aprendiste. Sobre 0.7 es alta; entre 0.3 y 0.7, media.</p></div>`;
}

/* ========== Vista: Evaluar ========== */
function vEvaluar(){
  const d=diagAtt(),fs=finalAtts(),g=ganancia();
  const bars=MODULOS.map((m,i)=>{const b=S.prog[m.id].best??0;const h=b*1.2;return `<rect x="${18+i*48}" y="${130-h}" width="30" height="${h}" rx="4" fill="${b>=70?'#22c55e':b>0?'#f59e0b':'#26262d'}"/><text x="${33+i*48}" y="146" text-anchor="middle" font-size="10" fill="#9a9aa5">C${m.n}</text><text x="${33+i*48}" y="${124-h}" text-anchor="middle" font-size="10" fill="#e8e8ec" font-family="monospace">${b?Math.round(b):''}</text>`}).join('');
  const hist=S.intentos.slice(-8).reverse();
  view().innerHTML=`<div class="fade"><h2>📊 Evaluar y medir</h2>
  <div class="card"><div class="row"><div class="grow"><h3 style="margin:0">1 · Diagnóstico inicial</h3><p class="small muted" style="margin:2px 0 0">${DIAGQ.length} preguntas, una o dos por capítulo. Hazlo antes de leer: es tu línea base.</p></div>${d?`<span class="tag ok">${Math.round(d.pct)}%</span>`:''}</div><button class="btn ${d?'':'pri'} full" style="margin-top:10px" onclick="go('diag')">${d?'Repetir (no cambia la línea base)':'Empezar diagnóstico'}</button></div>
  <div class="card"><h3>2 · Quiz por capítulo</h3><p class="small muted" style="margin:0 0 8px">Aprobado desde 70% (14/20). Las preguntas y opciones se mezclan en cada intento.</p>
  ${MODULOS.map(m=>{const p=S.prog[m.id];return `<button class="mod" style="padding:10px" onclick="go('quiz/${m.id}')"><div class="ic" style="width:40px;height:40px;font-size:1.3rem">${m.icono}</div><div class="grow"><div class="t small">${m.n}. ${esc(m.titulo)}</div><div class="s">${p.n?`${p.n} intento${p.n>1?'s':''} · mejor ${Math.round(p.best)}%`:'Sin intentos'}</div></div>${p.best!=null?`<span class="tag ${p.best>=70?'ok':'am'}">${nota20(p.best).toFixed(1)}</span>`:''}</button>`}).join('')}</div>
  <div class="card"><div class="row"><div class="grow"><h3 style="margin:0">3 · Examen final</h3><p class="small muted" style="margin:2px 0 0">25 preguntas: las ${DIAGQ.length} del diagnóstico + ${25-DIAGQ.length} al azar. Así se compara antes y después con las mismas preguntas.</p></div>${fs.length?`<span class="tag ok">${Math.round(fs[fs.length-1].pct)}%</span>`:''}</div><button class="btn ${fs.length?'':'pri'} full" style="margin-top:10px" onclick="go('final')">${fs.length?'Repetir examen final':'Rendir examen final'}</button></div>
  ${g?ganCard(g):''}
  <div class="card"><h3>Mejor nota por capítulo</h3><svg class="chart" viewBox="0 0 350 152">${bars}<line x1="10" x2="345" y1="${130-84}" y2="${130-84}" stroke="#06b6d4" stroke-dasharray="4 3"/><text x="345" y="${126-84}" text-anchor="end" font-size="9" fill="#06b6d4">70%</text></svg></div>
  <div class="card"><h3>Últimos intentos</h3>${hist.length?hist.map(a=>`<div class="row small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="grow">${a.tipo==='diag'?'Diagnóstico':a.tipo==='final'?'Examen final':'Quiz cap. '+MODULOS.find(m=>m.id===a.mid)?.n}</span><span class="muted">${fmtF(a.fecha)}</span><b class="mono ${a.pct>=70?'okc':'am'}">${Math.round(a.pct)}%</b></div>`).join(''):'<p class="small muted">Todavía no hay intentos.</p>'}</div>
  <div class="callout amber small">Esto mide el <b>nivel 2 de Kirkpatrick</b> (aprendizaje). El nivel 3 lo mides tú en campo: registra tus charlas reales en la pestaña Charla.</div></div>`;
}

/* ========== Vista: Repasar (Leitner) ========== */
const INTERVALO={1:0,2:1,3:3,4:7,5:16};
let RQ=null;
function vRepasar(modo,mid){
  unlockCards();
  if(modo==='practica'){const m=MODULOS.find(x=>x.id===mid);if(!m)return go('repasar');RQ={practica:true,cola:shuffle(m.cartas.map(c=>c.id)),hechas:0,titulo:'Práctica libre · Cap. '+m.n};return renderCard()}
  if(modo==='sesion'){const due=shuffle(dueCards().map(c=>c.id)).slice(0,20);if(!due.length)return go('repasar');RQ={practica:false,cola:due,hechas:0,falladas:new Set(),titulo:'Repaso de hoy'};return renderCard()}
  const cs=Object.values(S.cards),due=dueCards().length,cnt=[1,2,3,4,5].map(b=>cs.filter(c=>c.caja===b).length);
  const prox=cs.filter(c=>c.prox>now()).sort((a,b)=>a.prox-b.prox)[0];
  view().innerHTML=`<div class="fade"><h2>🗂️ Repaso espaciado</h2><p class="small muted">Sistema Leitner: si recuerdas la tarjeta, sube de caja y vuelve más tarde (1, 3, 7 y 16 días). Si fallas, vuelve a la caja 1. Las tarjetas de cada capítulo se desbloquean al terminar de leerlo o al hacer su quiz.</p>
  <div class="card"><div class="boxes">${cnt.map((n,i)=>`<div><b>${n}</b><span>Caja ${i+1}</span></div>`).join('')}</div>
  <p class="small" style="margin:12px 0">${cs.length?`${cs.length} tarjetas desbloqueadas · <b class="cy">${cnt[4]}</b> dominadas (caja 5).`:'Aún no hay tarjetas. Termina de leer el capítulo 1.'}</p>
  <button class="btn pri full" ${due?'':'disabled'} onclick="go('repasar/sesion')">${due?`Repasar ${Math.min(due,20)} tarjeta${due>1?'s':''} pendientes`:'Nada pendiente hoy'}</button>
  ${!due&&prox?`<p class="small muted" style="margin:8px 0 0">Próximo repaso: ${fmtF(prox.prox)}</p>`:''}</div>
  <div class="card"><h3>Práctica libre por capítulo</h3><p class="small muted" style="margin:0 0 8px">No altera tu calendario de repaso.</p>${MODULOS.map(m=>`<button class="mod" style="padding:10px" onclick="go('repasar/practica/${m.id}')"><div class="ic" style="width:40px;height:40px;font-size:1.3rem">${m.icono}</div><div class="grow t small">${m.n}. ${esc(m.titulo)}</div><span class="muted small">${m.cartas.length} tarjetas</span></button>`).join('')}</div></div>`;
}
function cardById(id){for(const m of MODULOS){const c=m.cartas.find(c=>c.id===id);if(c)return{c,m}}}
function renderCard(){
  if(!RQ.cola.length){view().innerHTML=`<div class="fade card" style="text-align:center"><div style="font-size:3rem">🎉</div><h2>¡Sesión terminada!</h2><p class="muted">${RQ.hechas} tarjetas revisadas. Ahora deja que el sueño haga su parte: la consolidación ocurre de noche.</p><button class="btn pri" onclick="go('repasar')">Volver</button></div>`;return}
  const id=RQ.cola[0],{c,m}=cardById(id),st=S.cards[id];
  view().innerHTML=`<div class="fade"><div class="qhead"><button class="ib" onclick="go('repasar')">✕</button><span class="small muted">${esc(RQ.titulo)}</span><span class="mono am">${RQ.cola.length}</span></div>
  <div class="flash" id="fl"><div class="in"><div class="fc front"><small>Cap. ${m.n}${st&&!RQ.practica?' · caja '+st.caja:''}</small>${esc(c.f)}<div class="small muted" style="margin-top:14px;font-weight:400">Responde en voz alta y toca para voltear</div></div><div class="fc back"><small>Respuesta</small>${esc(c.b)}</div></div></div>
  <div id="cbt" style="display:none" class="row"><button class="btn grow" style="border-color:var(--bad)" id="no">😕 No lo sabía</button><button class="btn pri grow" id="si">😎 Lo sabía</button></div></div>`;
  $('#fl').onclick=()=>{$('#fl').classList.add('flip');$('#cbt').style.display='flex'};
  $('#no').onclick=()=>grade(false);$('#si').onclick=()=>grade(true);
}
function grade(ok){
  const id=RQ.cola.shift();RQ.hechas++;
  if(!RQ.practica){const st=S.cards[id];
    if(ok){if(!RQ.falladas.has(id)){st.caja=Math.min(5,st.caja+1);st.prox=now()+INTERVALO[st.caja]*DAY;st.ok++}else{st.prox=now()+DAY}}
    else{st.caja=1;st.ko++;RQ.falladas.add(id);RQ.cola.push(id)}
    R.tarjetas.put(st)}
  else if(!ok)RQ.cola.push(id);
  renderCard();
}

/* ========== Vista: Charla (planificar, autoevaluar, historial) ========== */
let plan={};
function vCharla(sub){
  sub=sub||'plan';
  const tabs=`<div class="seg" style="margin-bottom:14px">${[['plan','✍️ Planificar'],['eval','✅ Autoevaluar'],['hist','📈 Historial']].map(([k,n])=>`<button class="${sub===k?'on':''}" onclick="go('charla/${k}')">${n}</button>`).join('')}</div>`;
  if(sub==='plan')return planView(tabs);
  if(sub==='eval')return evalView(tabs);
  histView(tabs);
}
const PLANF=[['tema','Tema','Ej.: Línea de fuego en izaje'],['publico','Público y contexto','Ej.: 15 riggers y operadores, muelle, 6:30 a.m., ruido de motores'],['mensaje','Mensaje central (una conducta, menos de 15 palabras)','Ej.: Nadie se para debajo de una carga suspendida'],['gancho','Gancho de apertura','Pregunta, final anunciado, confesión u objeto real'],['p1','Idea 1 (por qué importa)',''],['p2','Idea 2 (cómo se hace)',''],['p3','Idea 3 (qué pasa si no) · opcional',''],['prueba','Prueba: historia, objeto o demostración',''],['verif','Verificación (teach-back o demostración inversa)','Ej.: Wilder, muéstrame dónde te pararías'],['compromiso','Compromiso para hoy',''],['proximo','Gancho para la próxima charla','Ej.: Mañana les cuento qué encontramos en la eslinga']];
function planView(tabs){
  const planes=S.charlas.filter(c=>c.tipo==='plan').reverse();
  view().innerHTML=`<div class="fade">${tabs}<div class="card"><h3>Planifica con la estructura del cerebro</h3><p class="small muted" style="margin:0">Gancho → mensaje → máximo 3 ideas → prueba → verificación → compromiso.</p>
  ${PLANF.map(([k,l,ph])=>`<label class="f">${l}</label>${['gancho','prueba','publico'].includes(k)?`<textarea class="t" data-k="${k}" placeholder="${esc(ph)}">${esc(plan[k]||'')}</textarea>`:`<input class="t" data-k="${k}" placeholder="${esc(ph)}" value="${esc(plan[k]||'')}">`}${k==='mensaje'?'<div class="small" id="wc"></div>':''}`).join('')}
  <div class="row" style="margin-top:14px"><button class="btn grow" id="gen">Ver guion</button><button class="btn pri grow" id="sv">Guardar plan</button></div></div>
  ${planes.length?`<div class="card"><h3>Planes guardados</h3>${planes.map(p=>`<div class="row small" style="padding:7px 0;border-bottom:1px solid var(--line)"><span class="grow">${esc(p.plan.tema||'(sin tema)')}<br><span class="muted">${fmtF(p.fecha)}</span></span><button class="btn speak" onclick="loadPlan(${p.id})">Abrir</button><button class="btn speak" onclick="delCharla(${p.id},'plan')">🗑</button></div>`).join('')}</div>`:''}</div>`;
  const wc=()=>{const n=(plan.mensaje||'').trim().split(/\s+/).filter(Boolean).length;$('#wc').innerHTML=n?`<span class="${n<15?'okc':'badc'}">${n} palabras ${n<15?'✓':'· recórtalo, todavía no sabes qué quieres decir'}</span>`:''};
  $$('[data-k]').forEach(i=>i.addEventListener('input',()=>{plan[i.dataset.k]=i.value;if(i.dataset.k==='mensaje')wc()}));wc();
  $('#gen').onclick=()=>modal(`<h3>Guion de 5 minutos</h3><pre class="guion">${esc(guion())}</pre><div class="row"><button class="btn grow" onclick="closeModal()">Cerrar</button><button class="btn pri grow" onclick="copyTxt(guion())">Copiar</button></div>`);
  $('#sv').onclick=async()=>{if(!plan.tema&&!plan.mensaje)return toast('Escribe al menos el tema o el mensaje');const r={tipo:'plan',fecha:now(),plan:{...plan}};r.id=await R.charlas.put(r);S.charlas.push(r);toast('Plan guardado');vCharla('plan')};
}
function guion(){const p=plan,L=[];
  L.push(`CHARLA: ${p.tema||'(pendiente)'}`);if(p.publico)L.push(`Público: ${p.publico}`);L.push('');
  L.push(`[0:00] GANCHO\n${p.gancho||'(pregunta, objeto o final anunciado)'}`);
  L.push(`\n[0:30] MENSAJE CENTRAL\n«${p.mensaje||'(pendiente)'}»`);
  L.push(`\n[1:00] IDEAS\n1. ${p.p1||'(pendiente)'}\n2. ${p.p2||'(pendiente)'}${p.p3?'\n3. '+p.p3:''}`);
  L.push(`\nPRUEBA\n${p.prueba||'(historia, objeto o demostración)'}`);
  L.push(`\n[3:00] VERIFICACIÓN\n${p.verif||'(pendiente)'}\n(espera 5 segundos después de preguntar)`);
  L.push(`\n[4:00] COMPROMISO Y CIERRE\n${p.compromiso||'¿Qué harás distinto hoy?'}\nRepite: «${p.mensaje||'(pendiente)'}»${p.proximo?'\nGancho: '+p.proximo:''}`);
  L.push('\n[5:00] Firma de asistencia');return L.join('\n')}
window.loadPlan=id=>{const p=S.charlas.find(c=>c.id===id);if(p){plan={...p.plan};vCharla('plan');toast('Plan cargado')}};
window.delCharla=async(id,sub)=>{if(!confirm('¿Eliminar?'))return;await R.charlas.del(id);S.charlas=S.charlas.filter(c=>c.id!==id);vCharla(sub)};
let ev={};
function evalView(tabs){
  ev.pts=ev.pts||Array(RUBRICA.length).fill(0);
  view().innerHTML=`<div class="fade">${tabs}<div class="card"><h3>Autoevalúa tu última charla real</h3><p class="small muted" style="margin:0">1 = no lo hice · 2 = a medias · 3 = bien · 4 = excelente. Sé honesto: esto es para ti.</p>
  <label class="f">Fecha</label><input class="t" type="date" id="ef" value="${ev.f||new Date().toISOString().slice(0,10)}">
  <label class="f">Tema</label><input class="t" id="et" value="${esc(ev.t||'')}" placeholder="Ej.: Línea de fuego">
  <div style="margin-top:8px">${RUBRICA.map((r,i)=>`<div class="rub"><div class="small">${i+1}. ${esc(r)}</div><div class="lv">${[1,2,3,4].map(v=>`<button data-i="${i}" data-v="${v}" class="${ev.pts[i]===v?'on':''}">${v}</button>`).join('')}</div></div>`).join('')}</div>
  <label class="f">¿Qué mejoro en la próxima?</label><textarea class="t" id="en">${esc(ev.n||'')}</textarea>
  <label class="f">Observación de campo (nivel 3): ¿viste la conducta aplicada días después?</label><select class="t" id="eo"><option value="">Aún no observé</option><option value="si">Sí, la vi aplicada</option><option value="parcial">Parcialmente</option><option value="no">No se aplica</option></select>
  <button class="btn pri full" style="margin-top:14px" id="es">Guardar autoevaluación</button></div></div>`;
  $$('.lv button').forEach(b=>b.onclick=()=>{ev.pts[+b.dataset.i]=+b.dataset.v;$$(`.lv button[data-i="${b.dataset.i}"]`).forEach(x=>x.classList.toggle('on',x===b))});
  ['ef','et','en'].forEach(k=>$('#'+k).addEventListener('input',e=>ev[k[1]]=e.target.value));
  $('#es').onclick=async()=>{if(ev.pts.some(v=>!v))return toast('Califica los 10 criterios');
    const sum=ev.pts.reduce((a,b)=>a+b,0);const r={tipo:'eval',fecha:new Date($('#ef').value+'T12:00').getTime()||now(),tema:$('#et').value,pts:[...ev.pts],pct:(sum-10)/30*100,nota:$('#en').value,obs:$('#eo').value};
    r.id=await R.charlas.put(r);S.charlas.push(r);S.charlas.sort((a,b)=>a.fecha-b.fecha);ev={};toast('Guardado');go('charla/hist')};
}
function histView(tabs){
  const es=S.charlas.filter(c=>c.tipo==='eval');
  let body='<p class="small muted">Aún no hay autoevaluaciones. Después de tu próxima charla, regístrala en "Autoevaluar".</p>';
  if(es.length){
    const avg=RUBRICA.map((_,i)=>es.reduce((a,e)=>a+e.pts[i],0)/es.length);
    const weak=avg.map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]).slice(0,2);
    const pts=es.slice(-12),X=i=>20+i*(310/Math.max(1,pts.length-1)),Y=p=>110-p;
    body=`<div class="grid2"><div class="stat"><b>${es.length}</b><span>Charlas registradas</span></div><div class="stat"><b>${Math.round(es.reduce((a,e)=>a+e.pct,0)/es.length)}%</b><span>Promedio</span></div></div>
    <svg class="chart" viewBox="0 0 340 125" style="margin-top:10px"><line x1="10" x2="335" y1="${Y(70)}" y2="${Y(70)}" stroke="#26262d" stroke-dasharray="4 3"/>${pts.length>1?`<polyline points="${pts.map((e,i)=>X(i)+','+Y(e.pct)).join(' ')}" fill="none" stroke="#06b6d4" stroke-width="2.5"/>`:''}${pts.map((e,i)=>`<circle cx="${X(i)}" cy="${Y(e.pct)}" r="4" fill="#f59e0b"/>`).join('')}</svg>
    <div class="callout amber"><b>Enfoca tu práctica en:</b><ul>${weak.map(([v,i])=>`<li>${esc(RUBRICA[i])} <span class="mono muted">(${v.toFixed(1)}/4)</span></li>`).join('')}</ul></div>
    ${es.slice().reverse().map(e=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row small"><span class="grow"><b>${esc(e.tema||'(sin tema)')}</b><br><span class="muted">${fmtF(e.fecha)}${e.obs?' · campo: '+({si:'aplicada ✓',parcial:'parcial',no:'no aplicada'}[e.obs]):''}</span></span><b class="mono ${e.pct>=70?'okc':'am'}">${Math.round(e.pct)}%</b><button class="btn speak" onclick="delCharla(${e.id},'hist')">🗑</button></div>${e.nota?`<div class="small cy">→ ${esc(e.nota)}</div>`:''}</div>`).join('')}`;
  }
  view().innerHTML=`<div class="fade">${tabs}<div class="card"><h3>Tu evolución como comunicador</h3>${body}</div></div>`;
}

/* ========== Vista: Ajustes ========== */
function vAjustes(){
  view().innerHTML=`<div class="fade"><h2>⚙️ Ajustes</h2><div class="card">
  <label class="f">Tu nombre (para el saludo)</label><input class="t" id="an" value="${esc(S.cfg.nombre)}">
  <div class="sw"><span>Vibración al tocar</span><button class="tg ${S.cfg.vib?'on':''}" data-c="vib"></button></div>
  <div class="sw"><span>Texto grande</span><button class="tg ${S.cfg.big?'on':''}" data-c="big"></button></div>
  <label class="f">Velocidad de lectura en voz alta: <b id="rv">${S.cfg.rate}</b></label><input type="range" min="0.7" max="1.4" step="0.1" value="${S.cfg.rate}" id="ar" style="width:100%;accent-color:#f59e0b">
  </div>
  <div class="card"><h3>Respaldo</h3><p class="small muted">Tus datos viven solo en este dispositivo. Exporta un respaldo antes de cambiar de teléfono o borrar el navegador.</p>
  <div class="row"><button class="btn grow" id="ex">⬇️ Exportar</button><label class="btn grow">⬆️ Importar<input type="file" accept=".json" id="im" hidden></label></div>
  <button class="btn full" style="margin-top:10px;border-color:var(--bad);color:var(--bad)" id="rs">Borrar todo mi progreso</button></div>
  <p class="small muted" style="text-align:center">NeuroComunica v1.0 · Personajes de los relatos ficticios; datos científicos con autor y año para que puedas verificarlos.</p></div>`;
  $('#an').oninput=e=>{S.cfg.nombre=e.target.value.trim();saveCfg()};
  $$('.tg').forEach(b=>b.onclick=()=>{const k=b.dataset.c;S.cfg[k]=!S.cfg[k];b.classList.toggle('on',S.cfg[k]);if(k==='big')document.documentElement.classList.toggle('big',S.cfg.big);saveCfg()});
  $('#ar').oninput=e=>{S.cfg.rate=+e.target.value;$('#rv').textContent=S.cfg.rate;saveCfg()};
  $('#ex').onclick=()=>{const data={app:'neurocomunica',v:1,fecha:now(),cfg:S.cfg,prog:S.prog,cards:Object.values(S.cards),intentos:S.intentos,charlas:S.charlas};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download=`neurocomunica-respaldo-${new Date().toISOString().slice(0,10)}.json`;a.click()};
  $('#im').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.app!=='neurocomunica')throw 0;if(!confirm('Esto reemplaza tu progreso actual. ¿Continuar?'))return;
    for(const r of Object.values(R))await r.clear();await R.kv.put({k:'cfg',v:d.cfg});await R.kv.put({k:'prog',v:d.prog});for(const c of d.cards)await R.tarjetas.put(c);for(const a of d.intentos)await R.intentos.put(a);for(const c of d.charlas)await R.charlas.put(c);toast('Respaldo importado');setTimeout(()=>location.reload(),700)}catch(err){toast('Archivo no válido')}};
  $('#rs').onclick=async()=>{if(!confirm('¿Borrar todo tu progreso, intentos, tarjetas y charlas? No se puede deshacer.'))return;for(const r of Object.values(R))await r.clear();location.hash='';location.reload()};
}

/* ========== Modal y copia ========== */
function modal(h){closeModal();const m=document.createElement('div');m.className='modal';m.id='mdl';m.innerHTML=`<div class="card">${h}</div>`;m.onclick=e=>{if(e.target===m)closeModal()};document.body.appendChild(m)}
function closeModal(){$('#mdl')?.remove()}
async function copyTxt(t){try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Copiado')}}
Object.assign(window,{go,closeModal,copyTxt});

/* ========== Arranque ========== */
(async()=>{
  await load();
  $$('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.go));
  window.addEventListener('hashchange',route);route();
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
